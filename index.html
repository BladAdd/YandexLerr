                    <div class="glass-card p-5 rounded-2xl mb-8 flex flex-col items-center border border-white/10" style="box-shadow: inset 0 0 30px ${bgGlow}">
                        <div class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-3">Содержимое контейнера</div>
                        <div class="flex items-center gap-4">
                            <i class="fa-solid ${icon} text-4xl drop-shadow-md"></i>
                            <span class="text-4xl font-black font-orbitron text-white">+${formatNum(amount)}</span>
                        </div>
                    </div>
                    
                    <div class="flex gap-4">
                        <button onclick="closeModal()" class="flex-1 bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white py-4 rounded-xl font-bold transition-all border border-white/10 hover:border-white/20">Отклонить</button>
                        <button onclick="acceptShuttleOffer()" class="flex-[2] bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white py-4 rounded-xl font-bold transition-all shadow-[0_0_20px_rgba(34,197,94,0.4)] hover:shadow-[0_0_30px_rgba(34,197,94,0.6)] btn-shine flex justify-center items-center gap-2">
                            <i class="fa-solid fa-video"></i> Забрать груз
                        </button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function acceptShuttleOffer() {
            if(!currentShuttleOffer) return;
            const { type, amount } = currentShuttleOffer;
            showRewardedVideo(success => {
                if (!success) {
                    currentShuttleOffer = null;
                    closeModal();
                    showToast("Груз утерян: реклама не была досмотрена.");
                    return;
                }
                if (type === 'min') {
                    state.res.min += amount;
                    addLifetimeMin(amount);
                    showToast("Груз получен: +" + formatNum(amount) + " Минералов!");
                } else if (type === 'sci') {
                    state.res.sci += amount;
                    showToast("Данные расшифрованы: +" + formatNum(amount) + " Науки!");
                } else if (type === 'prm') {
                    state.res.prm += amount;
                    showToast("Контейнер открыт: +" + formatNum(amount) + " Кристаллов!");
                }

                playSFX('epic');
                saveGame();
                updateHeaderUI();
                updateDynamicUI();
                closeModal();
                currentShuttleOffer = null;
                
                const f = document.createElement('div');
                f.className = 'fixed inset-0 bg-green-400 z-50 mix-blend-overlay opacity-100 pointer-events-none transition-opacity duration-300';
                document.body.appendChild(f);
                setTimeout(() => f.style.opacity = '0', 50);
                setTimeout(() => f.remove(), 350);
            });
        }

        let adminClickCount = 0;
        let adminClickTimer = null;

        function handleLogoClick() {
            if (!new URLSearchParams(location.search).has('dev')) return;
            adminClickCount++;
            clearTimeout(adminClickTimer);
            adminClickTimer = setTimeout(() => { adminClickCount = 0; }, 2000);

            if (adminClickCount >= 5) {
                adminClickCount = 0;
                openAdminPanel();
                playSFX('epic');
            }
        }

        function openAdminPanel() {
            const modal = document.getElementById('generic-modal');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <div class="flex justify-between items-center mb-6 border-b border-red-500/50 pb-4">
                    <h3 class="font-orbitron font-black text-2xl text-red-500 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]"><i class="fa-solid fa-user-shield mr-2"></i> DEV PANEL</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors bg-white/5 hover:bg-white/10 w-10 h-10 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                
                <div class="space-y-4">
                    <div class="flex items-center gap-4 glass-card p-3 rounded-xl border border-white/10 hover:border-mars-500/50 transition-colors">
                        <div class="w-1/3 text-sm font-bold text-gray-200 flex items-center gap-2"><i class="fa-solid fa-gem text-mars-400 text-lg"></i> Минералы</div>
                        <input type="number" id="admin-add-min" value="1000000000000000" class="flex-1 bg-black/80 border border-white/20 rounded-lg px-4 py-2.5 text-white font-orbitron focus:border-mars-500 outline-none transition-colors">
                        <button onclick="adminAddRes('min')" class="bg-mars-600 hover:bg-mars-500 text-white px-5 py-2.5 rounded-lg font-bold transition-transform active:scale-95 shadow-[0_0_15px_rgba(229,89,52,0.4)] border border-mars-400">Выдать</button>
                    </div>
                    <div class="flex items-center gap-4 glass-card p-3 rounded-xl border border-white/10 hover:border-sci-500/50 transition-colors">
                        <div class="w-1/3 text-sm font-bold text-gray-200 flex items-center gap-2"><i class="fa-solid fa-flask text-sci-400 text-lg"></i> Наука</div>
                        <input type="number" id="admin-add-sci" value="1000000000000000" class="flex-1 bg-black/80 border border-white/20 rounded-lg px-4 py-2.5 text-white font-orbitron focus:border-sci-500 outline-none transition-colors">
                        <button onclick="adminAddRes('sci')" class="bg-sci-600 hover:bg-sci-500 text-white px-5 py-2.5 rounded-lg font-bold transition-transform active:scale-95 shadow-[0_0_15px_rgba(34,197,94,0.4)] border border-sci-400">Выдать</button>
                    </div>
                    <div class="flex items-center gap-4 glass-card p-3 rounded-xl border border-white/10 hover:border-prem-500/50 transition-colors">
                        <div class="w-1/3 text-sm font-bold text-gray-200 flex items-center gap-2"><i class="fa-solid fa-gem text-prem-400 text-lg"></i> Кристаллы</div>
                        <input type="number" id="admin-add-prm" value="100000" class="flex-1 bg-black/80 border border-white/20 rounded-lg px-4 py-2.5 text-white font-orbitron focus:border-prem-500 outline-none transition-colors">
                        <button onclick="adminAddRes('prm')" class="bg-prem-600 hover:bg-prem-500 text-white px-5 py-2.5 rounded-lg font-bold transition-transform active:scale-95 shadow-[0_0_15px_rgba(168,85,247,0.4)] border border-prem-400">Выдать</button>
                    </div>
                    <div class="flex items-center gap-4 glass-card p-3 rounded-xl border border-white/10 hover:border-purple-500/50 transition-colors">
                        <div class="w-1/3 text-sm font-bold text-gray-200 flex items-center gap-2"><i class="fa-solid fa-infinity text-purple-400 text-lg"></i> Темная Мат.</div>
                        <input type="number" id="admin-add-dm" value="100000" class="flex-1 bg-black/80 border border-white/20 rounded-lg px-4 py-2.5 text-white font-orbitron focus:border-purple-500 outline-none transition-colors">
                        <button onclick="adminAddRes('dm')" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2.5 rounded-lg font-bold transition-transform active:scale-95 shadow-[0_0_15px_rgba(147,51,234,0.4)] border border-purple-400">Выдать</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function adminAddRes(type) {
            const val = parseFloat(document.getElementById('admin-add-' + type).value) || 0;
            if (val <= 0) return;
            
            if (type === 'min') {
                state.res.min += val;
                addLifetimeMin(val);
            } else if (type === 'sci') {
                state.res.sci += val;
            } else if (type === 'prm') {
                state.res.prm += val;
            } else if (type === 'dm') {
                if(!state.rebirth) state.rebirth = { count: 0, darkMatter: 0 };
                state.rebirth.darkMatter += val;
                recalculate();
            }
            
            updateHeaderUI();
            saveGame();
            showToast("Ресурсы выданы!");
            playSFX('epic');
            
            if (currentTab === 'hq') updateHQStatsUI();
            updateDynamicUI();
            if (currentTab === 'quests') updateQuestsUI();
        }

        let scene, camera, renderer, marsMesh, atmosMesh, phobosMesh, rimLight, wireMesh, sunGlow, ringsMesh;
        let targetCameraX = 0, targetCameraY = 0;

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020408, 0.025);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 22;
            
            const initialCamX = window.innerWidth > 768 ? -6 : 0;
            camera.position.x = initialCamX;
            targetCameraX = initialCamX;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const aLight = new THREE.AmbientLight(0xffffff, 0.15); scene.add(aLight);
            const pLight = new THREE.PointLight(0xffeedd, 1.8, 100);
            pLight.position.set(12, 5, 15); scene.add(pLight);
            
            rimLight = new THREE.DirectionalLight(0xE55934, 1.5);
            rimLight.position.set(-10, -5, -10);
            scene.add(rimLight);
            
            const geo = new THREE.SphereGeometry(8, 64, 64);
            marsMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x8a2610, roughness: 0.7, metalness: 0.2 }));
            scene.add(marsMesh);
            
            atmosMesh = new THREE.Mesh(new THREE.SphereGeometry(8.3, 32, 32), new THREE.MeshBasicMaterial({ color: 0xE55934, transparent: true, opacity: 0.2, side: THREE.BackSide, blending: THREE.AdditiveBlending }));
            scene.add(atmosMesh);

            wireMesh = new THREE.Mesh(new THREE.SphereGeometry(8.4, 16, 16), new THREE.MeshBasicMaterial({ color: 0xE55934, wireframe: true, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending }));
            scene.add(wireMesh);

            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 128, 128);
            const tex = new THREE.CanvasTexture(canvas);
            
            sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: 0xE55934, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending }));
            sunGlow.scale.set(40, 40, 1);
            sunGlow.position.set(0, 0, -10);
            scene.add(sunGlow);

            const ringGeo = new THREE.BufferGeometry();
            const ringPos = new Float32Array(5000 * 3);
            for(let i=0; i<5000; i++) {
                const a = Math.random() * Math.PI * 2;
                const r = 11 + Math.random() * 4;
                ringPos[i*3] = Math.cos(a) * r;
                ringPos[i*3+1] = (Math.random() - 0.5) * 0.5;
                ringPos[i*3+2] = Math.sin(a) * r;
            }
            ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
            ringsMesh = new THREE.Points(ringGeo, new THREE.PointsMaterial({ size: 0.05, color: 0xE55934, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
            ringsMesh.rotation.x = Math.PI / 2.5;
            scene.add(ringsMesh);

            phobosMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 }));
            scene.add(phobosMesh);

            const sGeo = new THREE.BufferGeometry();
            const sPos = new Float32Array(3000 * 3);
            const sColors = new Float32Array(3000 * 3);
            const color = new THREE.Color();
            for(let i=0; i<3000; i++) {
                sPos[i*3] = (Math.random() - 0.5) * 150;
                sPos[i*3+1] = (Math.random() - 0.5) * 150;
                sPos[i*3+2] = (Math.random() - 0.5) * 150 - 20;
                
                color.setHSL(Math.random() * 0.2 + 0.5, 0.8, Math.random() * 0.5 + 0.5); 
                sColors[i*3] = color.r; sColors[i*3+1] = color.g; sColors[i*3+2] = color.b;
            }
            sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
            sGeo.setAttribute('color', new THREE.BufferAttribute(sColors, 3));
            
            const starMat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
            const stars = new THREE.Points(sGeo, starMat);
            scene.add(stars);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                const baseCamX = window.innerWidth > 768 ? -6 : 0;
                targetCameraX = baseCamX;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                resizeCanvas();
                if (currentTab === 'tech') setTimeout(drawTechLines, 50);
            });
            
            // Mouse Parallax effect
            document.addEventListener('mousemove', (e) => {
                const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                const baseCamX = window.innerWidth > 768 ? -6 : 0;
                targetCameraX = baseCamX + mouseX * 1.5;
                targetCameraY = mouseY * 1.5;
            });

            animate3D();
        }

        let phobosAngle = 0;
        let currentPlanetScale = 1;

        function animate3D() {
            requestAnimationFrame(animate3D);
            
            if(marsMesh) marsMesh.rotation.y += 0.0004;
            if(atmosMesh) atmosMesh.rotation.y += 0.0006;
            if(wireMesh) {
                wireMesh.rotation.y += 0.0008;
                wireMesh.rotation.x += 0.0002;
            }
            if(ringsMesh) ringsMesh.rotation.z -= 0.0005;
            
            targetPlanetScale += (1 - targetPlanetScale) * 0.05; 
            currentPlanetScale += (targetPlanetScale - currentPlanetScale) * 0.15; 
            if(marsMesh) marsMesh.scale.setScalar(currentPlanetScale);
            if(atmosMesh) atmosMesh.scale.setScalar(currentPlanetScale);
            if(wireMesh) wireMesh.scale.setScalar(currentPlanetScale);
            
            if(phobosMesh) {
                phobosAngle += 0.0015;
                phobosMesh.position.x = Math.cos(phobosAngle) * 14;
                phobosMesh.position.z = Math.sin(phobosAngle) * 14;
                phobosMesh.rotation.y += 0.01;
                phobosMesh.rotation.x += 0.005;
            }
            
            camera.position.x += (targetCameraX - camera.position.x) * 0.05;
            camera.position.y += (targetCameraY - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0); 
            
            renderer.render(scene, camera);
        }

        const uiCanvas = document.getElementById('ui-particles');
        const ctx = uiCanvas.getContext('2d');
        let floaters = [];
        let particles = [];

        function resizeCanvas() { uiCanvas.width = window.innerWidth; uiCanvas.height = window.innerHeight; }
        
        function spawnFloatingText(text) {
            const rect = document.getElementById('main-clicker').getBoundingClientRect();
            const angle = Math.random() * Math.PI * 2;
            const r = rect.width/2 - 20;
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            
            floaters.push({
                x: cx + Math.cos(angle)*r,
                y: cy + Math.sin(angle)*r,
                vx: Math.cos(angle) * (Math.random()*1+1.5),
                vy: Math.sin(angle) * (Math.random()*1+1) - 2.5,
                text: text,
                life: 1.0,
                scale: 0.5
            });
        }
        
        function spawnParticles() {
            const rect = document.getElementById('main-clicker').getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const p = PLANETS[state.planet || 'mars'];
            
            for(let i=0; i<6; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 2;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
                    life: 1.0,
                    size: Math.random() * 3 + 1,
                    color: p.color.replace('text-', '') 
                });
            }
        }

        function animateCanvas() {
            requestAnimationFrame(animateCanvas);
            ctx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            
            for(let i = floaters.length - 1; i >= 0; i--) {
                let f = floaters[i];
                f.life -= 0.015;
                f.scale += (1.2 - f.scale) * 0.1; 
                
                if(f.life <= 0) { floaters.splice(i, 1); continue; }
                f.x += f.vx;
                f.y += f.vy;
                
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.scale(f.scale, f.scale);
                ctx.font = "900 18px 'Orbitron'";
                ctx.fillStyle = `rgba(255, 255, 255, ${f.life})`;
                ctx.shadowColor = `rgba(255, 255, 255, ${f.life * 0.8})`;
                ctx.shadowBlur = 15;
                ctx.fillText(f.text, 0, 0);
                ctx.restore();
            }
            
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life -= 0.02;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; 
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                ctx.shadowColor = 'rgba(255, 150, 50, 1)'; 
                ctx.shadowBlur = 10;
                ctx.fill();
            }
        }

        window.onload = () => {
            document.body.addEventListener('pointerdown', initAudio, { once: true });

            loadGame(); 
            init3D();
            updatePlanetVisuals();
            resizeCanvas();
            
            const clicker = document.getElementById('main-clicker');
            clicker.addEventListener('mousedown', () => doClick(true));
            clicker.addEventListener('touchstart', (e) => { e.preventDefault(); doClick(true); });
            
            initSkills(); 
            recalculate();
            
            if ((document.body.clientWidth < 768 && state.uiMode === 'auto') || state.uiMode === 'mobile') {
                switchTab('core');
            } else {
                switchTab('build');
            }
            
            requestAnimationFrame(gameLoop);
            requestAnimationFrame(animateCanvas);
            lastFrame = performance.now();

            initYandexSDK();
        };

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                saveGame();
                if (ysdk && ysdk.gameplayStop) { try { ysdk.gameplayStop(); } catch(e) {} }
            } else {
                if (ysdk && ysdk.gameplayStart) { try { ysdk.gameplayStart(); } catch(e) {} }
            }
        });
        window.addEventListener('pagehide', () => saveGame());
    </script>
