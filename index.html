    <script>
        window.tailwind = {
            config: {
                theme: {
                    extend: {
                        colors: {
                            mars: { 400: '#FF7B59', 500: '#E55934', 600: '#C7411E', 800: '#5A1F0D', 900: '#2A0D05' },
                            sci: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' },
                            prem: { 400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 900: '#4c1d95' },
                            terra: { 400: '#38bdf8', 500: '#0ea5e9', 900: '#0c4a6e' },
                            gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                        },
                        animation: {
                            'spin-slow': 'spin 12s linear infinite',
                            'spin-reverse-slow': 'spin-reverse 10s linear infinite',
                            'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                            'float': 'float 4s ease-in-out infinite',
                            'shimmer': 'shimmer 2.5s infinite',
                        },
                        keyframes: {
                            'spin-reverse': { '0%': { transform: 'rotate(360deg)' }, '100%': { transform: 'rotate(0deg)' } },
                            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } },
                            shimmer: { '0%': { transform: 'translateX(-100%)' }, '100%': { transform: 'translateX(100%)' } }
                        }
                    }
                }
            }
        };

    <link rel="stylesheet" href="lib/fa/all.min.css">
    <script src="/sdk.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #030508; color: white; user-select: none; -webkit-touch-callout: none; font-family: 'Rajdhani', sans-serif; touch-action: none; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .text-shadow-sm { text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
        .text-shadow-md { text-shadow: 2px 2px 6px rgba(0,0,0,1), -1px -1px 3px rgba(0,0,0,0.6); }
        .text-glow { text-shadow: 0 0 15px currentColor; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        #ui-particles { position: absolute; top:0; left:0; width:100vw; height:100vh; pointer-events: none; z-index: 5; }
        #vignette { position: absolute; top:0; left:0; width:100vw; height:100vh; pointer-events: none; z-index: 2; box-shadow: inset 0 0 150px rgba(0,0,0,0.8); transition: box-shadow 0.3s ease; }
        
        #ui-layer { position: relative; z-index: 10; height: 100vh; width: 100vw; display: flex; flex-direction: column; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        .glass-panel { background: linear-gradient(135deg, rgba(8, 12, 20, 0.75) 0%, rgba(2, 4, 8, 0.9) 100%); backdrop-filter: blur(16px) saturate(150%); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1); }
        .glass-card { background: linear-gradient(180deg, rgba(15, 22, 35, 0.6) 0%, rgba(10, 15, 25, 0.8) 100%); backdrop-filter: blur(10px) saturate(120%); border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .glass-card:hover { transform: translateY(-3px) scale(1.01); border-color: rgba(255,255,255,0.3); background: linear-gradient(180deg, rgba(25, 35, 55, 0.7) 0%, rgba(15, 20, 35, 0.9) 100%); box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2); z-index: 10; }
        .glass-card:active { transform: translateY(0) scale(0.99); }
        
        .tab-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0.4; position: relative; overflow: hidden; transform-origin: bottom; flex-shrink: 0; }
        .tab-btn::after { content: ''; position: absolute; bottom: 0; left: 50%; width: 0; height: 3px; background: #E55934; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-50%); box-shadow: 0 -2px 10px rgba(229,89,52,0); }
        .tab-btn.active { opacity: 1; transform: scale(1.05); text-shadow: 0 0 12px rgba(229,89,52,0.9); }
        .tab-btn.active::after { width: 100%; box-shadow: 0 -3px 15px rgba(229,89,52,1); }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(229,89,52,0.8), rgba(199,65,30,0.8)); border-radius: 4px; box-shadow: inset 0 0 2px rgba(0,0,0,0.5); }

        .heat-bar-bg { box-shadow: inset 0 3px 6px rgba(0,0,0,1), 0 0 15px rgba(229,89,52,0.1); border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.7); }
        .heat-bar-fill-texture { background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.4) 10px, rgba(0,0,0,0.4) 20px); mix-blend-mode: overlay; }
        .overheat-flash { animation: flashRed 0.5s infinite alternate ease-in-out; }
        @keyframes flashRed { 0% { box-shadow: 0 0 10px rgba(229,89,52,0.3); } 100% { box-shadow: 0 0 50px rgba(255,0,0,0.8); border-color: rgba(255,50,50,0.8); } }
        
        .skill-btn-wrapper { position: relative; width: 3.5rem; height: 3.5rem; margin-bottom: 0.5rem; }
        @media (min-width: 768px) { .skill-btn-wrapper { width: 100%; height: auto; margin-bottom: 0; } }
        
        .skill-btn { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); background: linear-gradient(135deg, rgba(15,15,25,0.8), rgba(5,5,10,0.9)); border: 1px solid rgba(255,255,255,0.1); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 0.75rem; overflow: visible; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .skill-btn:hover { border-color: rgba(255,255,255,0.5); box-shadow: 0 0 20px currentColor; transform: translateX(8px); z-index: 50; }
        .skill-btn:active:not(:disabled) { transform: scale(0.92) translateX(8px); }
        
        .skill-cooldown-container { position: absolute; inset: 0; border-radius: 0.75rem; overflow: hidden; pointer-events: none; z-index: 0; }
        .skill-cooldown { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); transition: height 0.1s linear; border-top: 2px solid currentColor; backdrop-filter: blur(3px); opacity: 0.9; }
        
        .skill-tooltip { visibility: hidden; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: absolute; left: calc(100% + 20px); top: 50%; transform: translateY(-50%) translateX(-20px) scale(0.9); background: linear-gradient(135deg, rgba(20,25,40,0.95), rgba(5,10,15,0.98)); border: 1px solid rgba(255,255,255,0.15); padding: 16px; border-radius: 12px; width: 240px; z-index: 1000; pointer-events: none; box-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.2); backdrop-filter: blur(12px); }
        .skill-tooltip::before { content: ''; position: absolute; top: 50%; left: -6px; transform: translateY(-50%) rotate(45deg); width: 12px; height: 12px; background: rgba(20,25,40,0.98); border-left: 1px solid rgba(255,255,255,0.15); border-bottom: 1px solid rgba(255,255,255,0.15); }
        .skill-btn:hover .skill-tooltip, .locked-skill-btn:hover .skill-tooltip { visibility: visible; opacity: 1; transform: translateY(-50%) translateX(0) scale(1); }
        
        .locked-skill-btn { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 0.75rem; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s; overflow: visible; }
        .locked-skill-btn:hover { background: rgba(30,30,40,0.9); border-color: rgba(255,255,255,0.2); z-index: 50; transform: translateX(5px); }

        .reticle-core { transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s; }
        
        .modal-enter { animation: modalIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes modalIn { 0% { opacity: 0; transform: scale(0.8) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        
        .rarity-common { border-color: rgba(148,163,184,0.5); box-shadow: inset 0 0 15px rgba(148,163,184,0.1); }
        .rarity-rare { border-color: rgba(59,130,246,0.6); box-shadow: inset 0 0 20px rgba(59,130,246,0.2); }
        .rarity-epic { border-color: rgba(168,85,247,0.7); box-shadow: inset 0 0 25px rgba(168,85,247,0.3); }

        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        .shadow-glow-mars { box-shadow: 0 0 30px rgba(229,89,52,0.5); }
        .shadow-glow-mars-hover:hover { box-shadow: 0 0 60px rgba(229,89,52,0.9); }
        .shadow-glow-modal { box-shadow: 0 20px 60px rgba(0,0,0,1), 0 0 100px rgba(0,0,0,0.8); }
        
        .btn-shine { position: relative; overflow: hidden; }
        .btn-shine::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%); transform: skewX(-20deg); animation: shimmer 3s infinite; pointer-events: none; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* ========================================= */
        /*   UI MODE STYLES (AUTO / PC / MOBILE)     */
        /* ========================================= */

        /* ------ MOBILE LAYOUT ------ */
        body.ui-mobile #game-main, body.ui-auto #game-main { display: block; height: 100%; position: relative; }
        
        body.ui-mobile #game-clicker-section, body.ui-auto #game-clicker-section { position: absolute; inset: 0; bottom: 70px; height: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 10px; }
        
        body.ui-mobile #game-sidebar-container, body.ui-auto #game-sidebar-container { display: block; }

        body.ui-mobile #game-sidebar, body.ui-auto #game-sidebar { position: fixed; inset: 0; top: 12vh; bottom: 70px; z-index: 40; background: rgba(10,15,25,0.96); backdrop-filter: blur(25px); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 24px 24px 0 0; transform: translateY(120%); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.8); width: 100%; display: flex; flex-direction: column; overflow: hidden; }
        
        body.ui-mobile #game-sidebar.panel-open, body.ui-auto #game-sidebar.panel-open { transform: translateY(0); }
        
        body.ui-mobile #main-nav, body.ui-auto #main-nav { position: fixed; bottom: 0; left: 0; width: 100vw; height: 70px; z-index: 50; background: rgba(5,7,12,0.98); border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: env(safe-area-inset-bottom); display: flex; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
        
        body.ui-mobile .nav-tab-core, body.ui-auto .nav-tab-core { display: flex; }

        /* ------ PC LAYOUT ------ */
        body.ui-pc #game-main { display: flex; flex-direction: row; height: 100%; position: relative; }
        body.ui-pc #game-clicker-section { position: relative; flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; bottom: auto; padding-bottom: 2.5rem; }
        body.ui-pc #game-sidebar-container { position: relative; width: 460px; height: 100%; flex: none; display: flex; flex-direction: column; background: linear-gradient(135deg, rgba(8, 12, 20, 0.75) 0%, rgba(2, 4, 8, 0.9) 100%); backdrop-filter: blur(16px) saturate(150%); border-left: 1px solid rgba(255,255,255,0.1); box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 20; overflow: hidden; }
        body.ui-pc #main-nav { position: relative; width: 100%; height: auto; bottom: auto; background: rgba(0,0,0,0.4); border-top: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0; display: flex; overflow-x: auto; flex-shrink: 0; }
        body.ui-pc #game-sidebar { position: relative; width: 100%; flex: 1; inset: auto; top: auto; bottom: auto; transform: none !important; border-radius: 0; border: none; background: transparent; box-shadow: none; z-index: 10; display: flex; flex-direction: column; overflow: hidden; }
        body.ui-pc .nav-tab-core { display: none !important; }

        @media (min-width: 768px) {
            body.ui-auto #game-main { display: flex; flex-direction: row; height: 100%; position: relative; }
            body.ui-auto #game-clicker-section { position: relative; flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; bottom: auto; padding-bottom: 2.5rem; }
            body.ui-auto #game-sidebar-container { position: relative; width: 460px; height: 100%; flex: none; display: flex; flex-direction: column; background: linear-gradient(135deg, rgba(8, 12, 20, 0.75) 0%, rgba(2, 4, 8, 0.9) 100%); backdrop-filter: blur(16px) saturate(150%); border-left: 1px solid rgba(255,255,255,0.1); box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 20; overflow: hidden; }
            body.ui-auto #main-nav { position: relative; width: 100%; height: auto; bottom: auto; background: rgba(0,0,0,0.4); border-top: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0; display: flex; overflow-x: auto; flex-shrink: 0; }
            body.ui-auto #game-sidebar { position: relative; width: 100%; flex: 1; inset: auto; top: auto; bottom: auto; transform: none !important; border-radius: 0; border: none; background: transparent; box-shadow: none; z-index: 10; display: flex; flex-direction: column; overflow: hidden; }
            body.ui-auto .nav-tab-core { display: none !important; }
        }
    </style>
</head>

        /* ================= YANDEX GAMES SDK ================= */
        let ysdk = null;
        let cloudSaveTimer = null;

        function initYandexSDK() {
            if (typeof YaGames === 'undefined') { console.log('[YSDK] SDK не найден (локальный/тестовый режим)'); return; }
            YaGames.init().then(sdk => {
                ysdk = sdk;
                try {
                    if (ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready();
                    if (ysdk.gameplayStart) ysdk.gameplayStart();
                } catch(e) {}
                loadCloudSave();
                submitLeaderboard();
            }).catch(e => console.warn('[YSDK] init error', e));
        }

        function loadCloudSave() {
            if (!ysdk || !ysdk.player) return;
            try {
                ysdk.player.getData(['save']).then(data => {
                    if (!data || !data.save) return;
                    const cloud = JSON.parse(data.save);
                    if (!storageOk) {
                        try { localStorage.setItem('marsMagnateSave', data.save); location.reload(); } catch(e) {}
                        return;
                    }
                    const local = localStorage.getItem('marsMagnateSave');
                    if (!local) {
                        localStorage.setItem('marsMagnateSave', data.save);
                        location.reload();
                        return;
                    }
                    const loc = JSON.parse(local);
                    const cloudScore = (cloud.stats && cloud.stats.totalLifetime) || 0;
                    const localScore = (loc.stats && loc.stats.totalLifetime) || 0;
                    if (cloudScore > localScore) {
                        localStorage.setItem('marsMagnateSave', data.save);
                        location.reload();
                    }
                }).catch(() => {});
            } catch(e) {}
        }

        function queueCloudSave() {
            if (!ysdk || !ysdk.player) return;
            clearTimeout(cloudSaveTimer);
            cloudSaveTimer = setTimeout(() => {
                try { ysdk.player.setData({ save: JSON.stringify(state) }); } catch(e) {}
            }, 1500);
        }

        function showRewardedVideo(callback) {
            if (!ysdk || !ysdk.adv) { callback(true); return; }
            let rewarded = false;
            try {
                ysdk.adv.showRewardedVideo({
                    callbacks: {
                        onOpen: () => { if (ysdk.gameplayStop) ysdk.gameplayStop(); },
                        onRewarded: () => { rewarded = true; },
                        onClose: () => {
                            if (ysdk.gameplayStart) ysdk.gameplayStart();
                            callback(rewarded);
                        },
                        onError: () => { if (ysdk.gameplayStart) ysdk.gameplayStart(); callback(false); }
                    }
                });
            } catch(e) { callback(true); }
        }

        let lastInterstitialAt = Date.now();
        function maybeShowInterstitial() {
            if (!ysdk || !ysdk.adv) return;
            if (Date.now() - lastInterstitialAt < 180000) return;
            lastInterstitialAt = Date.now();
            try {
                ysdk.adv.showFullscreenAdv({
                    callbacks: {
                        onOpen: () => { if (ysdk.gameplayStop) ysdk.gameplayStop(); },
                        onClose: () => { if (ysdk.gameplayStart) ysdk.gameplayStart(); },
                        onError: () => { if (ysdk.gameplayStart) ysdk.gameplayStart(); }
                    }
                });
            } catch(e) {}
        }

        function submitLeaderboard() {
            if (!ysdk) return;
            try {
                ysdk.getLeaderboards().then(lb => {
                    lb.setLeaderboardScore('top_minerals', Math.floor(state.stats.totalLifetime || state.stats.totalMin || 0));
                }).catch(() => {});
            } catch(e) {}
        }

        function loadLeaderboard(containerEl) {
            if (!containerEl) return;
            if (!ysdk) { containerEl.style.display = 'none'; return; }
            try {
                ysdk.getLeaderboards().then(lb => {
                    lb.getLeaderboardEntries('top_minerals', { quantityTop: 10, includeUser: true }).then(entries => {
                        const rows = (entries && entries.entries) || [];
                        if (!rows.length) {
                            containerEl.innerHTML = '<div class="text-center text-gray-500 text-sm py-4">Пока пусто. Станьте первым магнатом!</div>';
                            return;
                        }
                        const meId = ysdk.player ? ysdk.player.id : null;
                        let html = rows.map((e, i) => {
                            const name = (e.player && e.player.publicName) || 'Игрок';
                            const score = e.score != null ? formatNum(e.score) : '0';
                            const isMe = e.player && meId && e.player.uniqueID === meId;
                            const medal = i === 0 ? 'fa-trophy text-gold-400' : (i === 1 ? 'fa-medal text-gray-300' : (i === 2 ? 'fa-medal text-amber-700' : 'fa-user text-gray-600'));
                            return `<div class="flex items-center justify-between px-3 py-2 rounded-lg bg-black/40 border border-white/5 ${isMe ? 'border-mars-500/60 bg-mars-900/30' : ''}">
                                <div class="flex items-center gap-3 min-w-0"><i class="fa-solid ${medal} w-5 text-center shrink-0"></i><span class="text-sm font-bold truncate max-w-[180px] ${isMe ? 'text-mars-300' : 'text-white'}">${i+1}. ${name}</span></div>
                                <span class="text-xs font-orbitron font-bold ${isMe ? 'text-mars-300' : 'text-gray-300'}">${score}</span>
                            </div>`;
                        }).join('');
                        containerEl.innerHTML = html;
                    }).catch(() => {});
                }).catch(() => {});
            } catch(e) {}
        }

        async function initAudio() {
            if (audioCtxStarted) return;
            try {
                await Tone.start();
                audioCtxStarted = true;
                
                synths.click = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 1, oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
                synths.click.volume.value = -15;
                
                synths.buy = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 1 } }).toDestination();
                synths.buy.volume.value = -15;

                synths.error = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 } }).toDestination();
                synths.error.volume.value = -15;

                synths.skill = new Tone.FMSynth().toDestination();
                synths.skill.volume.value = -15;
                
                synths.epic = new Tone.AMSynth().toDestination();
                synths.epic.volume.value = -10;
            } catch(e) { console.error("Audio init error", e); }
        }

        function playSFX(type) {
            if (!state.soundEnabled || !audioCtxStarted) return;
            try {
                if (type === 'click') synths.click.triggerAttackRelease("C2", "32n");
                if (type === 'buy') synths.buy.triggerAttackRelease("G5", "16n");
                if (type === 'error') synths.error.triggerAttackRelease("C3", "8n");
                if (type === 'skill') synths.skill.triggerAttackRelease("C5", "4n");
                if (type === 'epic') synths.epic.triggerAttackRelease("C3", "1n");
            } catch(e) {}
        }
        
        function toggleSound() {
            if (!state) return;
            state.soundEnabled = !state.soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (icon) icon.className = state.soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
            saveGame();
            if (state.soundEnabled && !audioCtxStarted) initAudio();
        }

        function loadGame() {
            const saved = localStorage.getItem('marsMagnateSave');
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    if(parsed.res) state.res = {...state.res, ...parsed.res};
                    if(parsed.bld) state.bld = {...state.bld, ...parsed.bld};
                    if(parsed.tech) state.tech = {...state.tech, ...parsed.tech};
                    if(parsed.crew) state.crew = {...state.crew, ...parsed.crew};
                    if(parsed.skills) state.skills = {...state.skills, ...parsed.skills};
                    if(parsed.stats) state.stats = {...state.stats, ...parsed.stats};
                    if(parsed.rebirth) state.rebirth = {...state.rebirth, ...parsed.rebirth};
                    if(parsed.skillsUnlocked) state.skillsUnlocked = {...state.skillsUnlocked, ...parsed.skillsUnlocked};
                    if(parsed.questsCompleted) state.questsCompleted = {...state.questsCompleted, ...parsed.questsCompleted};
                    if(parsed.lastTick) state.lastTick = parsed.lastTick;
                    if(parsed.skillsVisible !== undefined) state.skillsVisible = parsed.skillsVisible;
                    if(parsed.soundEnabled !== undefined) state.soundEnabled = parsed.soundEnabled;
                    if(parsed.planet) state.planet = parsed.planet;
                    if(parsed.unlockedPlanets) state.unlockedPlanets = {...state.unlockedPlanets, ...parsed.unlockedPlanets};
                    if(parsed.uiMode) state.uiMode = parsed.uiMode;
                    if(parsed.adBuffTimer) adBuffTimer = parsed.adBuffTimer;
                    
                    displayState.res.min = state.res.min;
                    displayState.res.sci = state.res.sci;
                    displayState.res.prm = state.res.prm;
                    displayState.darkMatter = state.rebirth?.darkMatter || 0;

                    const sndIcon = document.getElementById('sound-icon');
                    if(sndIcon) sndIcon.className = state.soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";

                    recalculate();
                    
                    let now = Date.now();
                    let diffSec = (now - state.lastTick) / 1000;
                    if (diffSec > 60) {
                        diffSec = Math.min(diffSec, 86400); 
                        let offMin = calc.rate.min * diffSec;
                        let offSci = calc.rate.sci * diffSec;
                        
                        if (offMin > 0 || offSci > 0) {
                            state.res.min += offMin;
                            state.res.sci += offSci;
                            addLifetimeMin(offMin);
                            showOfflineModal(diffSec, offMin, offSci);
                        }
                    }
                } catch(e) { console.error("Save Error", e); }
            }
            
            document.body.className = `antialiased text-gray-200 ui-${state.uiMode || 'auto'}`;
        }

        let storageOk = true;
        try { localStorage.setItem('__mars_t', '1'); localStorage.removeItem('__mars_t'); } catch(e) { storageOk = false; }

        function saveGame() {
            state.lastTick = Date.now();
            state.adBuffTimer = adBuffTimer;
            if (storageOk) {
                try { localStorage.setItem('marsMagnateSave', JSON.stringify(state)); } catch(e) {}
            }
            queueCloudSave();
        }

        function addLifetimeMin(amount) {
            state.stats.totalMin = (state.stats.totalMin || 0) + amount;
            state.stats.totalLifetime = (state.stats.totalLifetime || 0) + amount;
        }

        function resetGame() {
            localStorage.removeItem('marsMagnateSave');
            if (ysdk && ysdk.player) { try { ysdk.player.setData({ save: '' }); } catch(e) {} }
            location.reload();
        }

        function setUIMode(mode) {
            state.uiMode = mode;
            document.body.className = `antialiased text-gray-200 ui-${mode}`;
            saveGame();
            openSettings(); 
            
            const sidebar = document.getElementById('game-sidebar');
            if (currentTab !== 'core' && sidebar) sidebar.classList.add('panel-open');
            
            setTimeout(resizeCanvas, 350); 
        }

        let calc = { rate: {min: 0, sci: 0}, clickPower: 1, maxHeat: 100, marketRate: 0.01 };
        let heat = 0, isOverheated = false, combo = 1.0, comboTimer = 0, marketPhase = 0;
        let skillActive = {};
        let adBuffTimer = 0;

        function formatNum(num) {
            if (num === 0) return "0";
            if (num < 1000) return (num % 1 !== 0) ? num.toFixed(1) : Math.floor(num).toString();
            
            const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td"];
            const suffixNum = Math.floor(Math.log10(num) / 3);
            
            if (suffixNum >= suffixes.length) return num.toExponential(2);
            
            let shortValue = num / Math.pow(10, suffixNum * 3);
            shortValue = parseFloat(shortValue.toPrecision(3));
            if (shortValue % 1 !== 0) shortValue = shortValue.toFixed(1);
            
            return shortValue + suffixes[suffixNum];
        }
        
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function calculateDM(totalMin) {
            if (totalMin < 1000000) return 0;
            return Math.floor(Math.pow(totalMin / 1000000, 0.3));
        }
        function calculateDMCost(targetDM) {
            if(targetDM <= 0) return 1000000;
            return Math.ceil(Math.pow(targetDM, 1 / 0.3) * 1000000);
        }

        function recalculate() {
            let mult = { min: 1, sci: 1, click: 1, heat: 1, cost: 1 };
            
            if (state.tech.clk1) mult.click *= 2;
            if (state.tech.clk2) mult.click *= 3;
            if (state.tech.clk3) mult.click *= 5;
            if (state.tech.clk4) mult.click *= 10;
            if (state.tech.clk5) mult.click *= 25;
            if (state.tech.clk6) mult.click *= 100;
            if (state.tech.clk7) mult.click *= 500;

            if (state.tech.min1) mult.min *= 2;
            if (state.tech.min2) mult.min *= 3;
            if (state.tech.min3) mult.min *= 4;
            if (state.tech.min4) mult.min *= 5;
            if (state.tech.min5) mult.min *= 10;
            if (state.tech.min6) mult.min *= 25;
            if (state.tech.min7) mult.min *= 50;

            if (state.tech.sci1) mult.sci *= 2;
            if (state.tech.sci2) mult.sci *= 2;
            if (state.tech.sci3) mult.sci *= 3;
            if (state.tech.sci4) mult.sci *= 4;
            if (state.tech.sci5) mult.sci *= 10;
            if (state.tech.sci6) mult.sci *= 25;
            if (state.tech.sci7) mult.sci *= 50;

            if (state.tech.heat1) mult.heat *= 1.5;
            if (state.tech.heat2) mult.heat *= 2.0;
            if (state.tech.heat3) mult.heat *= 2.5;
            if (state.tech.heat4) mult.heat *= 3.5;
            if (state.tech.heat5) mult.heat *= 4.0;

            let planetMult = 1;
            if (state.planet && PLANETS[state.planet]) planetMult = PLANETS[state.planet].mult;
            mult.min *= planetMult;
            mult.sci *= planetMult;
            mult.click *= planetMult;

            let rebirthBonus = (state.rebirth?.darkMatter || 0) * 0.10;
            mult.min *= (1 + rebirthBonus);
            mult.sci *= (1 + rebirthBonus);
            mult.click *= (1 + rebirthBonus);

            let crewMinBonus = 0, crewSciBonus = 0, crewCostDiscount = 0;
            CREW_DATA.forEach(char => {
                const lvl = state.crew[char.id] || 0;
                if(lvl > 0) {
                    if (char.rarity === 'common') crewMinBonus += 0.05 * lvl;
                    if (char.rarity === 'rare' && char.effect.includes('Наука')) crewSciBonus += 0.1 * lvl;
                    if (char.rarity === 'rare' && char.effect.includes('Скидка')) crewCostDiscount += 0.02 * lvl;
                    if (char.rarity === 'epic') { crewMinBonus += 0.5 * lvl; crewSciBonus += 0.5 * lvl; }
                }
            });

            mult.min *= (1 + crewMinBonus);
            mult.sci *= (1 + crewSciBonus);
            mult.cost = Math.max(0.1, 1 - crewCostDiscount);

            if (adBuffTimer > 0) {
                mult.min *= 2;
                mult.sci *= 2;
            }

            calc.rate = { min: 0, sci: 0 };
            for (let id in BLD_DATA) {
                const lvl = state.bld[id] || 0;
                if(lvl === 0) continue;
                for (let r in BLD_DATA[id].prod) calc.rate[r] += BLD_DATA[id].prod[r] * lvl;
            }

            calc.rate.min *= mult.min;
            calc.rate.sci *= mult.sci;
            calc.maxHeat = 100 * mult.heat;
            
            calc.clickPower = (1 + calc.rate.min * 0.02) * mult.click * combo;
            if (skillActive['overdrive']) calc.clickPower *= 25;
        }

        let lastFrame = performance.now();
        let autoClickTimer = 0, autoSaveTimer = 0, submitTimer = 0;

        function gameLoop(time) {
            requestAnimationFrame(gameLoop);
            const rawDelta = (time - lastFrame) / 1000;
            lastFrame = time;
            if (rawDelta <= 0) return;
            const delta = Math.min(rawDelta, 0.1);
            const now = Date.now();
            state.lastTick = now;

            if (rawDelta > 2) {
                const cap = Math.min(rawDelta, 86400);
                const bgMin = calc.rate.min * cap;
                const bgSci = calc.rate.sci * cap;
                if (bgMin > 0 || bgSci > 0) {
                    state.res.min += bgMin;
                    addLifetimeMin(bgMin);
                    state.res.sci += bgSci;
                    showToast("Колония работала без вас: +" + formatNum(bgMin) + " Мин, +" + formatNum(bgSci) + " Науки");
                }
            }

            submitTimer += delta;
            if (submitTimer >= 60) { submitTimer = 0; submitLeaderboard(); }

            autoSaveTimer += delta;
            if (autoSaveTimer >= 10) { saveGame(); autoSaveTimer = 0; }

            for(let id in SKILLS) {
                if(SKILLS[id].duration) {
                    const elapsed = (now - (state.skills[id] || 0)) / 1000;
                    skillActive[id] = elapsed < SKILLS[id].duration;
                }
            }

            marketPhase += delta * 0.05;
            calc.marketRate = Math.max(0.005, 0.02 + Math.sin(marketPhase) * 0.015); 

            if(combo > 1.0) {
                comboTimer -= delta;
                if(comboTimer <= 0) {
                    combo = Math.max(1.0, combo - delta * 0.5);
                    updateComboUI();
                }
            }

            if(isOverheated) {
                heat -= calc.maxHeat * 0.2 * delta;
                if(heat <= 0) { heat = 0; isOverheated = false; document.getElementById('heat-warning').classList.add('hidden'); }
            } else if(!skillActive['freeze'] && heat > 0) {
                heat -= calc.maxHeat * 0.05 * delta;
                if(heat < 0) heat = 0;
            }
            updateHeatUI();

            if (adBuffTimer > 0) {
                adBuffTimer -= delta;
                if (adBuffTimer <= 0) {
                    adBuffTimer = 0;
                    recalculate();
                    showToast("Действие рекламного баффа (Турбо-режим) завершено");
                }
            }

            let autoRate = skillActive['swarm'] ? 15 : 0;
            if (autoRate > 0 && !isOverheated) {
                autoClickTimer += delta;
                if (autoClickTimer >= (1/autoRate)) { doClick(false, true); autoClickTimer = 0; }
            }

            const minEarned = calc.rate.min * delta;
            state.res.min += minEarned;
            addLifetimeMin(minEarned);
            state.res.sci += calc.rate.sci * delta;
            
            const lerpFactor = Math.min(1, delta * 10);
            displayState.res.min = lerp(displayState.res.min, state.res.min, lerpFactor);
            displayState.res.sci = lerp(displayState.res.sci, state.res.sci, lerpFactor);
            displayState.res.prm = lerp(displayState.res.prm, state.res.prm, lerpFactor);
            displayState.darkMatter = lerp(displayState.darkMatter, state.rebirth?.darkMatter || 0, lerpFactor);

            if(Math.abs(displayState.res.min - state.res.min) < 1) displayState.res.min = state.res.min;
            if(Math.abs(displayState.res.sci - state.res.sci) < 1) displayState.res.sci = state.res.sci;

            updateHeaderUI();
            updateSkillsUI();
            updateDynamicUI(); 
            updateQuestsUI(); 
            
            if(Math.random() < 0.001) spawnUFO();
            
            if(currentTab === 'hq') {
                const rateEl = document.getElementById('market-rate-display');

            }

        let targetPlanetScale = 1;

        function doClick(isManual, isAuto) {
            isManual = (isManual === undefined) ? true : isManual;
            isAuto = (isAuto === undefined) ? false : isAuto;
            if(isOverheated) return;
            if(state.res.min < 10 && isManual) {
                state.res.min += 1;
            }

            recalculate();
            state.res.min += calc.clickPower;
            addLifetimeMin(calc.clickPower);
            if(isManual) state.stats.clicks++;

            if(isManual) {
                combo = Math.min(3.0, combo + 0.05);
                comboTimer = 1.5;
                updateComboUI();
                spawnFloatingText("+" + formatNum(calc.clickPower));
                spawnParticles();
                updateDynamicUI();
                
                targetPlanetScale = 1.05; 
                
                if (currentTab === 'hq') { updateHQStatsUI(); updateRebirthUIProgress(); }
                if (currentTab === 'quests') updateQuestsUI();
                playSFX('click');
            }

            if(!skillActive['freeze']) {
                heat += isAuto ? 1 : 4;
                if(heat >= calc.maxHeat) {
                    isOverheated = true;
                    combo = 1.0;
                    document.getElementById('heat-warning').classList.remove('hidden');
                }
            }
        }

        function updateHQStatsUI() {
            const clicksEl = document.getElementById('hq-stat-clicks');
            const minEl = document.getElementById('hq-stat-total-min');
            if(clicksEl) clicksEl.innerText = formatNum(state.stats.clicks);
            if(minEl) minEl.innerText = formatNum(state.stats.totalMin || 0);
        }

        function updateComboUI() {
            const el = document.getElementById('combo-display');
            el.innerText = "Комбо x" + combo.toFixed(1);
            el.classList.remove('scale-110', 'scale-125', 'text-gold-400');
            if(combo > 2.0) {
                el.style.color = '#f59e0b';
                el.classList.add('scale-125', 'text-gold-400');
            } else if (combo > 1.5) {
                el.style.color = '#fde047';
                el.classList.add('scale-110');
            } else {
                el.style.color = '#fff';
            }
        }

        function updateHeatUI() {
            const fill = document.getElementById('heat-bar-fill');
            const pct = Math.min(100, (heat / calc.maxHeat) * 100);
            fill.style.width = pct + "%";
            const container = document.getElementById('heat-bar-container');
            const vignette = document.getElementById('vignette');
            
            if(pct > 85 && !isOverheated) {
                container.classList.add('overheat-flash');
                vignette.style.boxShadow = `inset 0 0 200px rgba(255, 0, 0, ${(pct-85)/15 * 0.8})`;
            } else if (isOverheated) {
                container.classList.remove('overheat-flash');
                vignette.style.boxShadow = `inset 0 0 300px rgba(255, 0, 0, 0.9)`;
            } else {
                container.classList.remove('overheat-flash');
                vignette.style.boxShadow = `inset 0 0 150px rgba(0, 0, 0, 0.8)`;
            }
        }

                dmContainer.classList.remove('flex');

            let crewMinBonus = 0, crewSciBonus = 0;

                    if (char.rarity === 'common') crewMinBonus += 5 * lvl;

            if(crewSciBonus > 0) { sciEl.innerText = `Экипаж: +${crewSciBonus}%`; sciEl.classList.remove('hidden'); }

        function buySkill(id) {
            const cost = SKILLS[id].cost;
            if (state.res.min >= cost) {
                state.res.min -= cost;
                if(!state.skillsUnlocked) state.skillsUnlocked = { strike: true };
                state.skillsUnlocked[id] = true;
                saveGame();
                showToast("Новый навык успешно разблокирован!");
                initSkills();
                playSFX('epic');
            } else {
                showToast("Недостаточно минералов для открытия!");
                playSFX('error');
            }
        }

        function updateSkillsUI() {
            if(!state.skillsVisible) return;
            const now = Date.now();
            for(let id in SKILLS) {
                const s = SKILLS[id];
                const isUnlocked = state.skillsUnlocked ? state.skillsUnlocked[id] : s.unlocked;
                if(!isUnlocked) continue;

                const cdTime = s.cd * 1000;
                const elapsed = now - (state.skills[id] || 0);
                const onCd = elapsed < cdTime;
                const cdPct = onCd ? 100 - (elapsed / cdTime) * 100 : 0;
                
                const btn = document.getElementById(`skill-btn-${id}`);
                const cdBar = document.getElementById(`skill-cd-${id}`);
                const statusTxt = document.getElementById(`skill-status-${id}`);
                
                if (btn && cdBar && statusTxt) {
                    cdBar.style.height = `${cdPct}%`;
                    if (onCd) {
                        btn.classList.add('opacity-50', 'cursor-not-allowed', 'border-white/5');
                        btn.classList.remove(...s.border.split(' '));
                        
                        const remainingSec = Math.ceil((cdTime - elapsed) / 1000);
                        let timeStr = "";
                        if (remainingSec >= 60) {
                            const m = Math.floor(remainingSec / 60);
                            const sec = remainingSec % 60;
                            timeStr = `${m}м ${sec}с`;
                        } else {
                            timeStr = `${remainingSec}с`;
                        }
                        statusTxt.innerText = timeStr;
                    } else {
                        btn.classList.remove('opacity-50', 'cursor-not-allowed', 'border-white/5');
                        btn.classList.add(...s.border.split(' '));
                        statusTxt.innerText = 'Готово';
                    }
                }
            }
        }

        function castSkill(id) {
            const now = Date.now(), skill = SKILLS[id];
            let cdTime = skill.cd * 1000;
            if (now - (state.skills[id] || 0) < cdTime) return;
            state.skills[id] = now;
            
            if(id === 'strike') {
                const amount = Math.max(100, calc.rate.min * 7200);
                state.res.min += amount;
                addLifetimeMin(amount);
                showToast("Удар: +" + formatNum(amount) + " Мин.");
                
                const f = document.createElement('div');
                f.className = 'fixed inset-0 bg-white z-50 mix-blend-overlay opacity-100 pointer-events-none transition-opacity duration-300';
                document.body.appendChild(f);
                setTimeout(() => f.style.opacity = '0', 50);
                setTimeout(() => f.remove(), 350);
            }
            if(id === 'coolant') { heat = 0; isOverheated = false; updateHeatUI(); document.getElementById('heat-warning').classList.add('hidden'); }
            if(id === 'overdrive') recalculate();
            if(id === 'timewarp') {
                const amountMin = calc.rate.min * 86400; 
                const amountSci = calc.rate.sci * 86400;
                state.res.min += amountMin;
                state.res.sci += amountSci;
                addLifetimeMin(amountMin);
                showToast("Искажение: +" + formatNum(amountMin) + " Мин, +" + formatNum(amountSci) + " Науки.");
                playSFX('epic');
            } else {
                playSFX('skill');
            }
            
            updateSkillsUI();
            saveGame();
        }

        function switchTab(tab) {
            const prevTab = currentTab;
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeBtns = document.querySelectorAll(`.tab-btn[onclick*="'${tab}'"]`);
            activeBtns.forEach(b => b.classList.add('active'));
            
            const sidebar = document.getElementById('game-sidebar');
            if (tab === 'core') {
                if (sidebar) sidebar.classList.remove('panel-open');
                return;
            } else {
                if (sidebar) sidebar.classList.add('panel-open');
            }

            const content = document.getElementById('tab-content');
            if (!content) return;
            const prevScroll = content.scrollTop;
            content.style.opacity = '0';
            content.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                content.innerHTML = '';
                if(tab === 'build') renderBuild(content);
                if(tab === 'tech') renderTech(content);
                if(tab === 'crew') renderCrew(content);
                if(tab === 'hq') renderHQ(content);
                if(tab === 'quests') renderQuests(content);
                if(tab === 'planets') renderPlanets(content);

                content.scrollTop = prevScroll;
                updateDynamicUI(); 
                content.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 100);

            if (prevTab !== tab) maybeShowInterstitial();
        }

        function buyBld(id) {
            let crewCostDiscount = 0;
            CREW_DATA.forEach(c => { if(c.rarity==='rare' && c.effect.includes('Скидка')) crewCostDiscount += 0.02 * (state.crew[c.id] || 0); });
            let costMultGlobal = Math.max(0.1, 1 - crewCostDiscount);

            const d = BLD_DATA[id], lvl = state.bld[id] || 0;
            let cost = (d.base.min * Math.pow(d.costMult, lvl)) * costMultGlobal;

        function watchAd(type) {
            showRewardedVideo(success => {
                if (!success) {
                    showToast("Реклама не досмотрена до конца. Награда не выдана.");
                    return;
                }
                if (type === 'min') {
                    const amount = Math.max(100, calc.rate.min * 1800); 
                    state.res.min += amount;
                    addLifetimeMin(amount);
                    showToast("Спонсорская помощь: +" + formatNum(amount) + " Мин.");
                } else if (type === 'sci') {
                    const amount = Math.max(10, calc.rate.sci * 1800); 
                    state.res.sci += amount;
                    showToast("Грант получен: +" + formatNum(amount) + " Науки.");
                } else if (type === 'prm') {
                    state.res.prm += 15;
                    showToast("Найден тайник: +15 Кристаллов!");
                } else if (type === 'cd') {
                    for (let id in state.skills) {
                        state.skills[id] = 0; 
                    }
                    updateSkillsUI();
                    showToast("Перезарядка всех навыков обнулена!");
                } else if (type === 'buff') {
                    adBuffTimer += 300; 
                    recalculate();
                    showToast("Турбо-режим активирован на 5 минут!");
                }

                playSFX('epic');
                saveGame();
                updateHeaderUI();
                updateDynamicUI();
                closeModal();
                
                const f = document.createElement('div');
                f.className = 'fixed inset-0 bg-green-500 z-50 mix-blend-overlay opacity-100 pointer-events-none transition-opacity duration-500';
                document.body.appendChild(f);
                setTimeout(() => f.style.opacity = '0', 50);
                setTimeout(() => f.remove(), 550);
            });
        }

        function updateRebirthUIProgress() {
            let totalMin = state.stats.totalMin || 0;
            let calcDM = calculateDM(totalMin);
            let nextDMCost = calculateDMCost(calcDM + 1);
            let prevDMCost = calculateDMCost(calcDM);
            let progress = totalMin - prevDMCost;
            let req = nextDMCost - prevDMCost;
            let pct = Math.min(100, Math.max(0, (progress / req) * 100));
            
            const bar = document.getElementById('rebirth-progress-bar');
            if (bar) bar.style.width = pct + "%";
            
            const reqText = document.getElementById('rebirth-next-req');
            if (reqText) {
                let remaining = nextDMCost - totalMin;
                reqText.innerHTML = `До следующей ТМ нужно: <span class="text-white">${formatNum(remaining)}</span> минералов`;
            }
        }

        function confirmRebirth() {
            const calcDM = calculateDM(state.stats.totalMin || 0);
            if (calcDM <= 0) return;
            const modal = document.getElementById('generic-modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="text-center">
                    <i class="fa-solid fa-infinity text-6xl text-purple-500 mb-6 drop-shadow-[0_0_20px_rgba(168,85,247,1)] animate-pulse"></i>
                    <h3 class="font-orbitron font-black text-2xl text-white mb-4 tracking-wide">Сингулярность</h3>
                    <p class="text-sm text-gray-300 mb-4 leading-relaxed bg-black/40 p-4 rounded-xl border border-white/5">Вы разрушите текущую базу и потеряете минералы, науку, здания и технологии.</p>
                    <p class="text-base text-purple-400 font-bold mb-8 drop-shadow-[0_0_5px_rgba(168,85,247,0.8)]">Взамен вы получите +${formatNum(calcDM)} Тёмной Материи<br><span class="text-[10px] text-gray-400 font-normal uppercase tracking-widest mt-2 block">(Экипаж, Кристаллы и Планеты сохранятся)</span></p>
                    <div class="flex gap-4">
                        <button onclick="closeModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-white py-4 rounded-xl font-bold transition-all border border-white/10 hover:border-white/30">Отмена</button>
                        <button onclick="doRebirth()" class="flex-1 bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white py-4 rounded-xl font-bold transition-all shadow-[0_0_25px_rgba(168,85,247,0.6)] btn-shine border border-purple-400">Переродиться</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function doRebirth() {
            const calcDM = calculateDM(state.stats.totalMin || 0);
            if (calcDM <= 0) return;
            if(!state.rebirth) state.rebirth = { count: 0, darkMatter: 0 };
            state.rebirth.count++;
            state.rebirth.darkMatter += calcDM;

            state.res.min = 0;
            state.res.sci = 0;
            state.bld = {};
            state.tech = {};
            state.stats.clicks = 0;
            state.stats.totalMin = 0; 
            state.skills = { strike: 0, freeze: 0, swarm: 0, coolant: 0, overdrive: 0, timewarp: 0 };
            state.questsCompleted = {}; 
            heat = 0;
            isOverheated = false;
            
            playSFX('epic');
            saveGame();
            submitLeaderboard();
            
            const f = document.createElement('div');
            f.className = 'fixed inset-0 bg-white z-50 transition-opacity duration-1000';
            f.style.opacity = '0';
            document.body.appendChild(f);
            
            setTimeout(() => { f.style.opacity = '1'; }, 50);
            setTimeout(() => location.reload(), 1000); 
        }

        function tradeMarketCustom() {
            const input = document.getElementById('market-input');
            const amount = Math.floor(parseFloat(input.value));
            
            if(isNaN(amount) || amount < 100) {
                showToast("Минимум 100 минералов для обмена!");
                playSFX('error');
                return;
            }
            if(amount > state.res.min) {
                showToast("Недостаточно минералов на балансе!");
                playSFX('error');
                return;
            }
            
            state.res.min -= amount;
            let sciGained = amount * calc.marketRate;
            state.res.sci += sciGained;
            
            showToast(`Успешно: +${formatNum(sciGained)} Науки`);
            playSFX('buy');
            input.value = ''; 
            saveGame();
            updateHeaderUI();
        }

        function marketMax() {
            const input = document.getElementById('market-input');
            if (!input) return;
            const amt = Math.floor(state.res.min);
            if (amt < 100) {
                showToast("Минимум 100 минералов для обмена!");
                playSFX('error');
                return;
            }
            input.value = amt;
            tradeMarketCustom();
        }

                    }

            container.innerHTML = html + '</div>';
            updateQuestsUI();

        function updateQuestsUI() {
            if(currentTab !== 'quests') return;
            
            QUESTS.forEach(q => {
                let isClaimed = state.questsCompleted[q.id];

                let progress = 0;
                if(q.type === 'clicks') progress = state.stats.clicks;
                if(q.type === 'min') progress = state.stats.totalMin || state.res.min;
                if(q.type === 'tech') progress = Object.keys(state.tech).length;
                if(q.type === 'crew') progress = Object.values(state.crew).reduce((a,b)=>a+b, 0);
                
                let isDone = progress >= q.target;
                let pct = Math.min(100, (progress / q.target) * 100);
                
                const card = document.getElementById(`quest-card-${q.id}`);
                const bar = document.getElementById(`quest-bar-${q.id}`);
                const desc = document.getElementById(`quest-desc-${q.id}`);
                const btn = document.getElementById(`quest-btn-${q.id}`);
                
                if(card) {
                    if(isClaimed) { card.style.order = 3; card.style.opacity = '0.5'; }
                    else if(isDone) { card.style.order = 1; card.style.opacity = '1'; }
                    else { card.style.order = 2; card.style.opacity = '1'; }
                }
                
                if(isClaimed) return;
                
                if(bar) bar.style.width = pct + "%";
                if(desc) desc.innerText = `${q.desc} (${formatNum(progress)} / ${formatNum(q.target)})`;
                
                if(btn) {
                    if(isDone && btn.disabled) {
                        btn.disabled = false;
                        btn.className = "shrink-0 px-4 py-2 rounded-lg text-xs font-bold bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white shadow-[0_0_15px_rgba(34,197,94,0.5)] transition-all active:scale-95 btn-shine border border-green-400 z-10 relative w-[80px]";
                    } else if(!isDone && !btn.disabled) {
                        btn.disabled = true;
                        btn.className = "shrink-0 px-4 py-2 rounded-lg text-xs font-bold bg-white/5 text-gray-500 transition-all border border-white/5 z-10 relative w-[80px]";
                    }
                }
            });
        }

        function claimQuest(id) {
            const q = QUESTS.find(x => x.id === id);
            if(!q) return;
            if(!state.questsCompleted) state.questsCompleted = {};
            state.questsCompleted[id] = true;
            if(q.reward.prm) state.res.prm += q.reward.prm;
            if(q.reward.min) state.res.min += q.reward.min;
            playSFX('epic');
            saveGame();
            showToast("Достижение выполнено! Награда получена.");
            updateHeaderUI();
            if(currentTab === 'quests') switchTab('quests');
            
            const f = document.createElement('div');
            f.className = 'fixed inset-0 bg-green-400 z-50 mix-blend-overlay opacity-100 pointer-events-none transition-opacity duration-300';
            document.body.appendChild(f);
            setTimeout(() => f.style.opacity = '0', 50);
            setTimeout(() => f.remove(), 350);
        }

            for(let id in PLANETS) {
                const p = PLANETS[id];
                const isUnlocked = state.unlockedPlanets[id];
                const isCurrent = state.planet === id;
                
                let btnHtml = '';
                if(isCurrent) {
                    btnHtml = `<button class="w-full py-3 rounded-xl text-xs font-bold bg-green-600/20 text-green-400 cursor-default border border-green-500/50 flex items-center justify-center gap-2 shadow-[inset_0_0_15px_rgba(34,197,94,0.2)]"><i class="fa-solid fa-location-dot"></i> Текущая база</button>`;
                } else if(isUnlocked) {
                    btnHtml = `<button onclick="travelPlanet('${id}')" class="w-full py-3 rounded-xl text-xs font-bold bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white shadow-[0_0_20px_rgba(37,99,235,0.5)] transition-all active:scale-95 btn-shine border border-blue-400 flex justify-between px-6 items-center"><span>Отправиться</span> <span class="bg-black/30 px-2 py-0.5 rounded text-[10px] shrink-0">Доход x${formatNum(p.mult)}</span></button>`;
                } else {
                    let canAfford = (state.rebirth?.darkMatter || 0) >= p.cost;
                    btnHtml = `<button id="btn-planet-${id}" onclick="unlockPlanet('${id}')" class="w-full py-3 rounded-xl text-xs font-bold transition-all active:scale-95 flex items-center justify-center gap-2 ${canAfford ? 'bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white shadow-[0_0_20px_rgba(168,85,247,0.5)] btn-shine border border-purple-400' : 'bg-white/5 text-gray-500 cursor-not-allowed border border-white/10'}" ${canAfford ? '' : 'disabled'}><i class="fa-solid fa-unlock text-[10px]"></i> Разблокировать: ${formatNum(p.cost)} ТМ</button>`;

                    ${isCurrent ? '<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(34,197,94,0.1),transparent)] pointer-events-none"></div>' : ''}

            container.innerHTML = html + '</div>';

        function unlockPlanet(id) {
            const p = PLANETS[id];
            if((state.rebirth?.darkMatter || 0) >= p.cost && !state.unlockedPlanets[id]) {
                state.rebirth.darkMatter -= p.cost;
                state.unlockedPlanets[id] = true;
                playSFX('epic');
                saveGame();
                switchTab('planets');
                showToast(`Открыт новый мир: ${p.name}!`);
                updateHeaderUI();
                
                const f = document.createElement('div');
                f.className = 'fixed inset-0 bg-purple-500 z-50 mix-blend-overlay opacity-100 pointer-events-none transition-opacity duration-500';
                document.body.appendChild(f);
                setTimeout(() => f.style.opacity = '0', 50);
                setTimeout(() => f.remove(), 550);
            } else {
                playSFX('error');
            }
        }

        function travelPlanet(id) {
            if(state.unlockedPlanets[id]) {
                state.planet = id;
                recalculate();
                updatePlanetVisuals();
                playSFX('epic');
                saveGame();
                switchTab('planets');
                showToast(`Перемещение на ${PLANETS[id].name} завершено!`);
                
                const f = document.createElement('div');
                f.className = 'fixed inset-0 bg-white z-50 mix-blend-overlay opacity-100 pointer-events-none transition-opacity duration-1000';
                document.body.appendChild(f);
                setTimeout(() => f.style.opacity = '0', 50);
                setTimeout(() => f.remove(), 1050);
            }
        }
        
        function updatePlanetVisuals() {
            if(!marsMesh) return;
            const p = PLANETS[state.planet || 'mars'];
            
            const bgHex = parseInt(p.bg);
            const atmosHex = parseInt(p.atmos);
            
            marsMesh.material.color.setHex(bgHex);
            if(atmosMesh) atmosMesh.material.color.setHex(atmosHex);
            if(wireMesh) wireMesh.material.color.setHex(atmosHex);
            if(sunGlow) sunGlow.material.color.setHex(atmosHex);
            if(rimLight) rimLight.color.setHex(atmosHex);
            
            if(ringsMesh) {
                ringsMesh.material.color.setHex(atmosHex);
            }
        }

        function updateDynamicUI() {
            if(currentTab === 'build') {
                let crewCostDiscount = 0;
                CREW_DATA.forEach(c => { if(c.rarity==='rare' && c.effect.includes('Скидка')) crewCostDiscount += 0.02 * (state.crew[c.id] || 0); });
                let costMultGlobal = Math.max(0.1, 1 - crewCostDiscount);

                for (let id in BLD_DATA) {
                    const btn = document.getElementById(`btn-bld-${id}`);
                    if(btn) {
                        const d = BLD_DATA[id], lvl = state.bld[id] || 0;
                        let cost = (d.base.min * Math.pow(d.costMult, lvl)) * costMultGlobal;
                        if(state.res.min >= cost) {
                            btn.disabled = false;
                            btn.classList.remove('bg-white/5', 'text-gray-500');
                            btn.classList.add(d.isSci ? 'bg-sci-600' : 'bg-mars-600', 'text-white', 'shadow-[0_0_15px_rgba(255,255,255,0.1)]', 'hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]');
                        } else {
                            btn.disabled = true;
                            btn.classList.add('bg-white/5', 'text-gray-500');
                            btn.classList.remove('bg-sci-600', 'bg-mars-600', 'text-white', 'shadow-[0_0_15px_rgba(255,255,255,0.1)]', 'hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]');
                        }
                    }
                }
            } else if (currentTab === 'tech') {
                for (let key in TECH_DATA) {
                    const btn = document.getElementById(`btn-tech-${key}`);
                    if(btn && !state.tech[key]) {
                        if(state.res.sci >= TECH_DATA[key].cost) {
                            btn.disabled = false;
                            btn.classList.remove('bg-white/5', 'text-gray-500');
                            btn.classList.add('bg-gradient-to-r', 'from-sci-600', 'to-sci-500', 'text-white', 'shadow-[0_0_15px_rgba(74,222,128,0.4)]', 'border-sci-400');
                        } else {
                            btn.disabled = true;
                            btn.classList.add('bg-white/5', 'text-gray-500');
                            btn.classList.remove('bg-gradient-to-r', 'from-sci-600', 'to-sci-500', 'text-white', 'shadow-[0_0_15px_rgba(74,222,128,0.4)]', 'border-sci-400');
                        }
                    }
                }
            } else if (currentTab === 'planets') {
                for(let id in PLANETS) {
                    const btn = document.getElementById(`btn-planet-${id}`);
                    if(btn && !state.unlockedPlanets[id]) {
                        if((state.rebirth?.darkMatter || 0) >= PLANETS[id].cost) {
                            btn.disabled = false;
                            btn.classList.remove('bg-white/5', 'text-gray-500', 'cursor-not-allowed');
                            btn.classList.add('bg-gradient-to-r', 'from-purple-600', 'to-purple-500', 'text-white', 'shadow-[0_0_20px_rgba(168,85,247,0.5)]', 'border-purple-400', 'btn-shine');
                        } else {
                            btn.disabled = true;
                            btn.classList.add('bg-white/5', 'text-gray-500', 'cursor-not-allowed');
                            btn.classList.remove('bg-gradient-to-r', 'from-purple-600', 'to-purple-500', 'text-white', 'shadow-[0_0_20px_rgba(168,85,247,0.5)]', 'border-purple-400', 'btn-shine');
                        }
                    }
                }
            }
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed top-28 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md text-black px-6 py-4 rounded-2xl font-black font-orbitron z-[100] shadow-[0_15px_40px_rgba(255,255,255,0.4),0_0_15px_rgba(255,255,255,0.8)] text-base whitespace-nowrap border border-white tracking-wide flex items-center gap-3';
            t.innerHTML = `<i class="fa-solid fa-circle-info text-blue-500 text-xl"></i> ${msg}`;
            document.body.appendChild(t);
            t.animate([{ transform: 'translate(-50%, -30px) scale(0.9)', opacity: 0 }, { transform: 'translate(-50%, 0) scale(1)', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'forwards' });
            setTimeout(() => {
                t.animate([{ transform: 'translate(-50%, 0) scale(1)', opacity: 1 }, { transform: 'translate(-50%, -20px) scale(0.9)', opacity: 0 }], { duration: 300, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' });
                setTimeout(() => t.remove(), 300);
            }, 2500);
        }

                ufo.style.transition = 'none';

            }
            
            playSFX('skill');

            const rand = Math.random();
        let type = 'min';

            amount = Math.max(100, calc.rate.sci * 1800); // 30 минут генерации науки

        } else {
            type = 'prm';
            // Ограниченный и сбалансированный бонус кристаллов

            icon = 'fa-gem text-prem-400';
            bgGlow = 'rgba(192,132,252,0.5)';
        }

        currentShuttleOffer = { type, amount };

        const modal = document.getElementById('generic-modal');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <div class="text-center">
                    <div class="relative inline-block mb-4">
                        <div class="absolute inset-0 rounded-full animate-pulse" style="box-shadow: 0 0 40px ${bgGlow}"></div>
