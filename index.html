        .skill-tooltip { visibility: hidden; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: absolute; left: calc(100% + 20px); top: 50%; transform: translateY(-50%) translateX(-20px) scale(0.9); background: linear-gradient(135deg, rgba(20,25,40,0.95), rgba(5,10,15,0.98)); border: 1px solid rgba(255,255,255,0.15); padding: 16px; border-radius: 12px; width: 240px; z-index: 1000; pointer-events: none; box-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.2); backdrop-filter: blur(12px); }
        .skill-tooltip::before { content: ''; position: absolute; top: 50%; left: -6px; transform: translateY(-50%) rotate(45deg); width: 12px; height: 12px; background: rgba(20,25,40,0.98); border-left: 1px solid rgba(255,255,255,0.15); border-bottom: 1px solid rgba(255,255,255,0.15); }
        .skill-btn:hover .skill-tooltip, .locked-skill-btn:hover .skill-tooltip { visibility: visible; opacity: 1; transform: translateY(-50%) translateX(0) scale(1); }

        @keyframes casinoShakeKf { 0%,100% { transform: translate(0,0); } 15% { transform: translate(-6px,3px); } 30% { transform: translate(5px,-4px); } 45% { transform: translate(-4px,-3px); } 60% { transform: translate(4px,3px); } 75% { transform: translate(-2px,2px); } }

        @keyframes casinoFloatUp { 0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.6); } 15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.15); } 100% { opacity: 0; transform: translateX(-50%) translateY(-70px) scale(1); } }
        .casino-ptc { position: absolute; width: 8px; height: 8px; border-radius: 9999px; pointer-events: none; z-index: 25; }

        .reel-strip { will-change: transform; }

        .reel-line { position: absolute; left: 0; right: 0; top: 50%; height: 96px; margin-top: -48px; border-top: 1px solid rgba(251,191,36,0.35); border-bottom: 1px solid rgba(251,191,36,0.35); pointer-events: none; z-index: 10; box-shadow: 0 0 18px rgba(251,191,36,0.15) inset; }

        /* ------ MOBILE LAYOUT ------ */
        body.ui-mobile #game-main, body.ui-auto #game-main { display: block; height: 100%; position: relative; }
        
        body.ui-mobile #game-clicker-section, body.ui-auto #game-clicker-section { position: absolute; inset: 0; bottom: 70px; height: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 10px; }
        
        body.ui-mobile #game-sidebar-container, body.ui-auto #game-sidebar-container { display: block; }

        body.ui-mobile #game-sidebar, body.ui-auto #game-sidebar { position: fixed; inset: 0; top: 12vh; bottom: 70px; z-index: 40; background: rgba(10,15,25,0.96); backdrop-filter: blur(25px); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 24px 24px 0 0; transform: translateY(120%); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.8); width: 100%; display: flex; flex-direction: column; overflow: hidden; }
        
        body.ui-mobile #game-sidebar.panel-open, body.ui-auto #game-sidebar.panel-open { transform: translateY(0); }
        
        body.ui-mobile #main-nav, body.ui-auto #main-nav { position: fixed; bottom: 0; left: 0; width: 100vw; height: 70px; z-index: 50; background: rgba(5,7,12,0.98); border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: env(safe-area-inset-bottom); display: flex; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
        
        body.ui-mobile .nav-tab-core, body.ui-auto .nav-tab-core { display: flex; }

        /* ------ PC LAYOUT ------ */

        function loadCloudSave() {
            if (!ysdk || !ysdk.player) return;
            try {
                ysdk.player.getData(['save']).then(data => {
                    if (!data || !data.save) return;
                    const cloud = JSON.parse(data.save);
                    if (!storageOk) {
                        try { localStorage.setItem('marsMagnateSave', data.save); location.reload(); } catch(e) {}
                        return;
                    }
                    const local = localStorage.getItem('marsMagnateSave');
                    if (!local) {
                        localStorage.setItem('marsMagnateSave', data.save);
                        location.reload();
                        return;
                    }
                    const loc = JSON.parse(local);
                    const cloudScore = (cloud.stats && cloud.stats.totalLifetime) || 0;
                    const localScore = (loc.stats && loc.stats.totalLifetime) || 0;
                    if (cloudScore > localScore) {
                        localStorage.setItem('marsMagnateSave', data.save);
                        location.reload();
                    }
                }).catch(() => {});
            } catch(e) {}
        }

                        onRewarded: () => { rewarded = true; },
                        onClose: () => {
                            if (ysdk.gameplayStart) ysdk.gameplayStart();
                            finish(rewarded);
                        },
                        onError: () => { if (ysdk.gameplayStart) ysdk.gameplayStart(); finish(false); }

        function loadGame() {
            const saved = localStorage.getItem('marsMagnateSave');
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    // STAGE 2: миграция сохраняет неизвестные/будущие поля, затем дополняет новые defaults.
                    const defaults = state;
                    state = { ...defaults, ...parsed };
                    state.saveVersion = SAVE_VERSION;
                    state.res = { ...defaults.res, ...(parsed.res || {}) };
                    state.bld = { ...(parsed.bld || {}) };
                    state.tech = { ...(parsed.tech || {}) };
                    state.crew = { ...(parsed.crew || {}) };
                    state.skills = { ...DEFAULT_SKILLS, ...(parsed.skills || {}) };
                    state.stats = { ...defaults.stats, ...(parsed.stats || {}) };
                    state.rebirth = { ...defaults.rebirth, ...(parsed.rebirth || {}) };
                    state.prestige = { ...defaults.prestige, ...(parsed.prestige || {}) };
                    // STAGE 4: принимаем прежние daily-поля как объект или legacy root-поля без потери прогресса.
                    const parsedDaily = parsed.daily || parsed.dailyReward || {};
                    const legacyDayValue = parsedDaily.lastClaimDay;
                    const legacyLastClaimDate = parsedDaily.lastClaimDate
                        || (typeof legacyDayValue === 'string' && (/^\d{4}-\d{2}-\d{2}$/.test(legacyDayValue) || legacyDayValue.includes('T')) ? legacyDayValue : null)
                        || parsed.lastDailyClaimDate || parsed.dailyLastClaim || null;
                    const legacyStreak = parsedDaily.streak ?? parsedDaily.day ?? parsed.dailyStreak ?? parsed.dailyDay ?? 0;
                    state.daily = {
                        ...defaults.daily,
                        ...parsedDaily,
                        streak: Math.max(0, Math.min(7, Number(legacyStreak) || 0)),
                        lastClaimDate: normalizeDailyDateKey(legacyLastClaimDate),
                        lastClaimDay: Number(parsedDaily.lastClaimDayNumber ?? parsedDaily.lastClaimDay ?? parsed.dailyLastClaimDay ?? legacyStreak) || null,
                        currentDay: Math.max(1, Math.min(7, Number(parsedDaily.currentDay || legacyStreak || 1))),
                        pending: parsedDaily.pending || null
                    };
                    const parsedOffline = parsed.offline || {};
                    legacyOfflineMigration = !parsed.offline;
                    state.offline = {
                        ...defaults.offline,
                        ...parsedOffline,
                        lastSavedAt: Number(parsedOffline.lastSavedAt || parsed.lastTick || Date.now()),
                        incomeSnapshot: { ...defaults.offline.incomeSnapshot, ...(parsedOffline.incomeSnapshot || {}) },
                        pending: parsedOffline.pending || null
                    };
                    state.skillsUnlocked = { ...DEFAULT_SKILLS_UNLOCKED, ...(parsed.skillsUnlocked || {}) };
                    state.questsCompleted = { ...(parsed.questsCompleted || {}) };
                    // STAGE 5: merge сохраняет неизвестные future/legacy achievement/task поля.
                    const parsedAchievements = parsed.achievements || {};
                    state.achievements = { ...defaults.achievements, ...parsedAchievements, claimed: { ...defaults.achievements.claimed, ...(parsedAchievements.claimed || {}) } };
                    const parsedTasks = parsed.dailyTasks || {};
                    state.dailyTasks = { ...defaults.dailyTasks, ...parsedTasks, tasks: Array.isArray(parsedTasks.tasks) ? parsedTasks.tasks : [] };
                    state.stats.totalClicks = Math.max(Number(state.stats.totalClicks) || 0, Number(state.stats.clicks) || 0);
                    state.stats.upgradePurchases = Math.max(0, Number(state.stats.upgradePurchases) || Object.values(state.bld).reduce((a, b) => a + (Number(b) || 0), 0));
                    state.stats.maxCombo = Math.max(1, Number(state.stats.maxCombo) || 1);
                    state.unlockedPlanets = { mars: true, ...(parsed.unlockedPlanets || {}) };
                    const dc = defaults.casino;
                    state.casino = { ...dc, ...(parsed.casino || {}), stats: { ...dc.stats, ...((parsed.casino && parsed.casino.stats) || {}) } };
                    if(!Array.isArray(state.casino.crashHistory)) state.casino.crashHistory = [];
                    if(parsed.adBuffTimer) adBuffTimer = parsed.adBuffTimer;
                    
                    displayState.res.min = state.res.min;
                    displayState.res.sci = state.res.sci;
                    displayState.res.prm = state.res.prm;
                    displayState.darkMatter = state.rebirth?.darkMatter || 0;

                    const sndIcon = document.getElementById('sound-icon');
                    if(sndIcon) sndIcon.className = state.soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";

                    recalculate();
                    prepareOfflineReward(Date.now());
                } catch(e) { console.error("Save Error", e); }
            }
            
            document.body.className = `antialiased text-gray-200 ui-${state.uiMode || 'auto'}`;
        }

        let storageOk = true;

        function saveGame() {
            const now = Date.now();
            state.lastTick = now;
            state.adBuffTimer = adBuffTimer;
            state.offline = state.offline || { lastSavedAt: now, incomeSnapshot: { min: 0, sci: 0 }, pending: null };
            state.offline.lastSavedAt = now;
            // STAGE 6: сессионный income-бафф не попадает в offline snapshot и не становится постоянным после reload.
            const eventIncomeMult = randomEventState.active ? randomEventState.active.incomeMultiplier : 1;
            state.offline.incomeSnapshot = {
                min: Math.max(0, Number(calc.rate.min) || 0) / eventIncomeMult,
                sci: Math.max(0, Number(calc.rate.sci) || 0) / eventIncomeMult
            };
            if (storageOk) {
                try { localStorage.setItem('marsMagnateSave', JSON.stringify(state)); } catch(e) {}
            }
            queueCloudSave();
        }

        // STAGE 3: создаём отложенную награду из сохранённого snapshot, не начисляя её до выбора.
        function prepareOfflineReward(now) {
            const offline = state.offline;
            if (!offline) return;
            if (offline.pending) {
                saveGame();
                showOfflineModal();
                return;
            }

            const actualSeconds = Math.max(0, (now - Number(offline.lastSavedAt || now)) / 1000);
            const cappedSeconds = Math.min(actualSeconds, BALANCE.offline.maxSeconds);
            const snapshot = legacyOfflineMigration
                ? { min: Math.max(0, Number(calc.rate.min) || 0), sci: Math.max(0, Number(calc.rate.sci) || 0) }
                : offline.incomeSnapshot;
            const reward = {
                min: Math.max(0, Number(snapshot.min) || 0) * cappedSeconds,
                sci: Math.max(0, Number(snapshot.sci) || 0) * cappedSeconds
            };
            legacyOfflineMigration = false;

            if (actualSeconds > BALANCE.offline.thresholdSeconds && (reward.min > 0 || reward.sci > 0)) {
                offline.pending = { actualSeconds, cappedSeconds, reward };
            }
            saveGame();
            if (offline.pending) showOfflineModal();
        }

                        <button onclick="confirmReset()" class="w-full bg-red-900/20 hover:bg-red-600 text-red-400 hover:text-white py-4 rounded-xl text-sm font-bold transition-all border border-red-500/30 shadow-[0_0_15px_rgba(255,0,0,0.1)] uppercase tracking-widest font-orbitron">Сбросить весь прогресс</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function confirmReset() {
            const modal = document.getElementById('generic-modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="text-center">
                    <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-6 drop-shadow-[0_0_15px_rgba(255,0,0,0.8)] animate-pulse"></i>
                    <h3 class="font-orbitron font-black text-2xl text-white mb-3 tracking-wide">Сброс прогресса</h3>
                    <p class="text-sm text-gray-300 mb-8 leading-relaxed">Вы уверены, что хотите удалить сохранение и начать заново? Это действие необратимо и сотрет все достижения.</p>
                    <div class="flex gap-4">
                        <button onclick="closeModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-white py-4 rounded-xl font-bold transition-all border border-white/20">Отмена</button>
                        <button onclick="resetGame()" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-4 rounded-xl font-bold transition-all shadow-[0_0_20px_rgba(255,0,0,0.5)] border border-red-400 btn-shine">Сбросить</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function resetGame() {
            localStorage.removeItem('marsMagnateSave');
            if (ysdk && ysdk.player) { try { ysdk.player.setData({ save: '' }); } catch(e) {} }
            setTimeout(() => location.reload(), 500);
        }

        function setUIMode(mode) {
            state.uiMode = mode;
            document.body.className = `antialiased text-gray-200 ui-${mode}`;
            saveGame();
            openSettings(); 
            
            setTimeout(resizeCanvas, 350); 
        }

        let calc = { rate: {min: 0, sci: 0}, clickPower: 1, maxHeat: 100, marketRate: 0.01 };
        let heat = 0, isOverheated = false, combo = BALANCE.combo.min, comboTimer = 0, marketPhase = 0;
        let skillActive = {};
        let adBuffTimer = 0;

        // STAGE 6: события намеренно сессионные; active-time не попадает в save и не идёт в offline reward.
        const randomEventState = { nextIn: 0, offer: null, offerRemaining: 0, active: null, activeRemaining: 0, uiAccumulator: 0 };

        function scheduleNextRandomEvent() {
            const cfg = BALANCE.randomEvents;
            randomEventState.nextIn = cfg.minIntervalSeconds + Math.random() * (cfg.maxIntervalSeconds - cfg.minIntervalSeconds);
        }

        function pickRandomEvent() {
            const events = BALANCE.randomEvents.events;
            const totalWeight = events.reduce((sum, event) => sum + event.weight, 0);
            let roll = Math.random() * totalWeight;
            for (const event of events) {
                roll -= event.weight;
                if (roll < 0) return event;
            }
            return events[events.length - 1];
        }

        function showRandomEventOffer(forcedId) {
            if (randomEventState.offer || randomEventState.active) return false;
            const event = BALANCE.randomEvents.events.find(item => item.id === forcedId) || pickRandomEvent();
            randomEventState.offer = event;
            randomEventState.offerRemaining = BALANCE.randomEvents.offerTtlSeconds;
            const toast = document.createElement('div');
            toast.id = 'random-event-offer';
            toast.className = 'fixed top-24 left-1/2 -translate-x-1/2 z-[105] interactive w-[min(92vw,430px)] rounded-2xl border border-cyan-300/40 bg-gradient-to-br from-gray-900/95 to-black/95 p-4 text-white shadow-[0_18px_45px_rgba(0,0,0,0.8),0_0_24px_rgba(34,211,238,0.25)] backdrop-blur-xl';
            toast.innerHTML = `<div class="flex items-start gap-3"><i class="fa-solid fa-bolt text-cyan-300 text-xl mt-1"></i><div class="min-w-0 flex-1"><div class="font-orbitron font-black text-sm text-cyan-200">${event.name}</div><div class="mt-1 text-xs text-gray-300">${event.description}</div></div><div id="random-event-offer-time" class="font-orbitron font-black text-sm text-white">${Math.ceil(randomEventState.offerRemaining)}с</div></div><button onclick="activateRandomEvent()" class="mt-3 w-full rounded-xl bg-gradient-to-r from-green-600 to-emerald-400 py-2.5 font-orbitron text-xs font-black uppercase tracking-wider text-white hover:brightness-110">Активировать</button>`;
            document.body.appendChild(toast);
            return true;
        }

        function removeRandomEventOffer() {
            const toast = document.getElementById('random-event-offer');
            if (toast) toast.remove();
            randomEventState.offer = null;
            randomEventState.offerRemaining = 0;
        }

        function activateRandomEvent() {
            const event = randomEventState.offer;
            if (!event || randomEventState.active) return;
            removeRandomEventOffer();
            randomEventState.active = event;
            randomEventState.activeRemaining = event.durationSeconds;
            randomEventState.uiAccumulator = BALANCE.randomEvents.uiUpdateSeconds;
            const badge = document.getElementById('random-event-buff');
            const name = document.getElementById('random-event-buff-name');
            if (badge) badge.classList.remove('hidden');
            if (name) name.textContent = event.name;
            recalculate();
            updateRandomEventUI(true);
        }

        function finishRandomEvent() {
            const ended = randomEventState.active;
            randomEventState.active = null;
            randomEventState.activeRemaining = 0;
            const badge = document.getElementById('random-event-buff');
            if (badge) badge.classList.add('hidden');
            recalculate();
            scheduleNextRandomEvent();
            if (ended) showToast(`${ended.name}: эффект завершён`);
        }

        function updateRandomEventUI(force) {
            if (!randomEventState.active) return;
            if (!force && randomEventState.uiAccumulator < BALANCE.randomEvents.uiUpdateSeconds) return;
            randomEventState.uiAccumulator = 0;
            const time = document.getElementById('random-event-buff-time');
            if (time) time.textContent = Math.ceil(randomEventState.activeRemaining) + 'с';
        }

        function tickRandomEvents(delta) {
            if (randomEventState.active) {
                randomEventState.activeRemaining -= delta;
                randomEventState.uiAccumulator += delta;
                if (randomEventState.activeRemaining <= 0) finishRandomEvent();
                else updateRandomEventUI(false);
                return;
            }
            if (randomEventState.offer) {
                randomEventState.offerRemaining -= delta;
                const time = document.getElementById('random-event-offer-time');
                if (time) time.textContent = Math.max(0, Math.ceil(randomEventState.offerRemaining)) + 'с';
                if (randomEventState.offerRemaining <= 0) {
                    removeRandomEventOffer();
                    scheduleNextRandomEvent();
                }
                return;
            }
            randomEventState.nextIn -= delta;
            if (randomEventState.nextIn <= 0) showRandomEventOffer();
        }

        function formatNum(num) {
            if (num === 0) return "0";
            if (num < 1000) return (num % 1 !== 0) ? num.toFixed(1) : Math.floor(num).toString();
            
            const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td"];
            const suffixNum = Math.floor(Math.log10(num) / 3);
            
            if (suffixNum >= suffixes.length) return num.toExponential(2);
            
            let shortValue = num / Math.pow(10, suffixNum * 3);
            shortValue = parseFloat(shortValue.toPrecision(3));
            if (shortValue % 1 !== 0) shortValue = shortValue.toFixed(1);
            
            return shortValue + suffixes[suffixNum];
        }
        
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function calculateDM(totalMin) {
            if (totalMin < 1000000) return 0;
            return Math.floor(Math.pow(totalMin / 1000000, 0.3));
        }
        function calculateDMCost(targetDM) {
            if(targetDM <= 0) return 1000000;
            return Math.ceil(Math.pow(targetDM, 1 / 0.3) * 1000000);
        }

        function recalculate() {
            let mult = { min: 1, sci: 1, click: 1, heat: 1, cost: 1 };
            
            if (state.tech.clk1) mult.click *= 2;
            if (state.tech.clk2) mult.click *= 3;
            if (state.tech.clk3) mult.click *= 5;
            if (state.tech.clk4) mult.click *= 10;
            if (state.tech.clk5) mult.click *= 25;
            if (state.tech.clk6) mult.click *= 100;
            if (state.tech.clk7) mult.click *= 500;

            if (state.tech.min1) mult.min *= 2;
            if (state.tech.min2) mult.min *= 3;
            if (state.tech.min3) mult.min *= 4;
            if (state.tech.min4) mult.min *= 5;
            if (state.tech.min5) mult.min *= 10;
            if (state.tech.min6) mult.min *= 25;
            if (state.tech.min7) mult.min *= 50;

            if (state.tech.sci1) mult.sci *= 2;
            if (state.tech.sci2) mult.sci *= 2;
            if (state.tech.sci3) mult.sci *= 3;
            if (state.tech.sci4) mult.sci *= 4;
            if (state.tech.sci5) mult.sci *= 10;
            if (state.tech.sci6) mult.sci *= 25;
            if (state.tech.sci7) mult.sci *= 50;

            if (state.tech.heat1) mult.heat *= 1.5;
            if (state.tech.heat2) mult.heat *= 2.0;
            if (state.tech.heat3) mult.heat *= 2.5;
            if (state.tech.heat4) mult.heat *= 3.5;
            if (state.tech.heat5) mult.heat *= 4.0;

            let planetMult = 1;
            if (state.planet && PLANETS[state.planet]) planetMult = PLANETS[state.planet].mult;
            mult.min *= planetMult;
            mult.sci *= planetMult;
            mult.click *= planetMult;

            let rebirthBonus = (state.rebirth?.darkMatter || 0) * 0.10;
            mult.min *= (1 + rebirthBonus);
            mult.sci *= (1 + rebirthBonus);
            mult.click *= (1 + rebirthBonus);

            // STAGE 2: каждое накопленное Аномальное ядро усиливает весь доход.
            const coreMult = 1 + BALANCE.prestige.incomePerCore * (state.prestige?.cores || 0);
            mult.min *= coreMult;
            mult.sci *= coreMult;
            mult.click *= coreMult;

            let crewMinBonus = 0, crewSciBonus = 0, crewCostDiscount = 0;
            CREW_DATA.forEach(char => {
                const lvl = state.crew[char.id] || 0;
                if(lvl > 0) {
                    if (char.rarity === 'common') crewMinBonus += 0.05 * lvl;
                    if (char.rarity === 'rare' && char.effect.includes('Наука')) crewSciBonus += 0.1 * lvl;
                    if (char.rarity === 'rare' && char.effect.includes('Скидка')) crewCostDiscount += 0.02 * lvl;
                    if (char.rarity === 'epic') { crewMinBonus += 0.5 * lvl; crewSciBonus += 0.5 * lvl; }
                }
            });

            mult.min *= (1 + crewMinBonus);
            mult.sci *= (1 + crewSciBonus);
            mult.cost = Math.max(0.1, 1 - crewCostDiscount);

            if (adBuffTimer > 0) {
                mult.min *= 2;
                mult.sci *= 2;
            }

            // STAGE 6: каждый событийный множитель применяется ровно один раз в общей формуле.
            if (randomEventState.active) {
                mult.min *= randomEventState.active.incomeMultiplier;
                mult.sci *= randomEventState.active.incomeMultiplier;
                mult.click *= randomEventState.active.clickMultiplier;
            }

            calc.rate = { min: 0, sci: 0 };
            for (let id in BLD_DATA) {
                const lvl = state.bld[id] || 0;
                if(lvl === 0) continue;
                for (let r in BLD_DATA[id].prod) calc.rate[r] += BLD_DATA[id].prod[r] * lvl;
            }

            calc.rate.min *= mult.min;
            calc.rate.sci *= mult.sci;
            calc.maxHeat = 100 * mult.heat;
            
            // STAGE 6: income x2 не протекает в clickPower через passive-share; click x3 остаётся отдельным множителем.
            const activeIncomeMult = randomEventState.active ? randomEventState.active.incomeMultiplier : 1;
            calc.clickPower = (1 + (calc.rate.min / activeIncomeMult) * BALANCE.economy.clickPassiveShare) * mult.click * combo;
            if (skillActive['overdrive']) calc.clickPower *= 10;
        }

        let lastFrame = performance.now();
        let autoClickTimer = 0, autoSaveTimer = 0, submitTimer = 0;

        function gameLoop(time) {
            requestAnimationFrame(gameLoop);
            const rawDelta = (time - lastFrame) / 1000;
            lastFrame = time;
            if (rawDelta <= 0) return;
            const delta = Math.min(rawDelta, 0.1);
            const now = Date.now();
            state.lastTick = now;

            // STAGE 3: пауза вкладки считается только через сохранённый snapshot и модалку выбора.
            if (document.hidden || rawDelta > 2) return;

            submitTimer += delta;
            if (submitTimer >= 60) { submitTimer = 0; submitLeaderboard(); }

            autoSaveTimer += delta;
            if (autoSaveTimer >= 10) { saveGame(); autoSaveTimer = 0; }

            for(let id in SKILLS) {
                if(SKILLS[id].duration) {
                    const elapsed = (now - (state.skills[id] || 0)) / 1000;
                    skillActive[id] = elapsed < SKILLS[id].duration;
                }
            }

            marketPhase += delta * 0.05;
            calc.marketRate = Math.max(0.005, 0.02 + Math.sin(marketPhase) * 0.015); 

            // STAGE 6: Геошторм замораживает и hold-таймер, и decay комбо.
            const comboFrozen = randomEventState.active && randomEventState.active.id === 'geostorm';
            if(combo > BALANCE.combo.min && !comboFrozen) {
                comboTimer -= delta;
                if(comboTimer <= 0) {
                    combo = Math.max(BALANCE.combo.min, combo - delta * BALANCE.combo.decayPerSecond);
                    updateComboUI();
                }
            }

            tickRandomEvents(delta);

            if(isOverheated) {
                heat -= calc.maxHeat * 0.2 * delta;
                if(heat <= 0) { heat = 0; isOverheated = false; document.getElementById('heat-warning').classList.add('hidden'); }
            } else if(!skillActive['freeze'] && heat > 0) {
                heat -= calc.maxHeat * 0.05 * delta;
                if(heat < 0) heat = 0;
            }
            updateHeatUI();

            if (adBuffTimer > 0) {
                adBuffTimer -= delta;
                if (adBuffTimer <= 0) {
                    adBuffTimer = 0;
                    recalculate();
                    showToast("Действие рекламного баффа (Турбо-режим) завершено");
                }
            }

            let autoRate = skillActive['swarm'] ? 8 : 0;
            if (autoRate > 0 && !isOverheated) {
                autoClickTimer += delta;
                if (autoClickTimer >= (1/autoRate)) { doClick(false, true); autoClickTimer = 0; }
            }

            const minEarned = calc.rate.min * delta;
            state.res.min += minEarned;
            addLifetimeMin(minEarned);
            state.res.sci += calc.rate.sci * delta;
            
            const lerpFactor = Math.min(1, delta * 10);
            displayState.res.min = lerp(displayState.res.min, state.res.min, lerpFactor);
            displayState.res.sci = lerp(displayState.res.sci, state.res.sci, lerpFactor);
            displayState.res.prm = lerp(displayState.res.prm, state.res.prm, lerpFactor);
            displayState.darkMatter = lerp(displayState.darkMatter, state.rebirth?.darkMatter || 0, lerpFactor);

            if(Math.abs(displayState.res.min - state.res.min) < 1) displayState.res.min = state.res.min;
            if(Math.abs(displayState.res.sci - state.res.sci) < 1) displayState.res.sci = state.res.sci;

            updateHeaderUI();
            updateSkillsUI();
            updateComboUI();
            updateTabBadges();
            casinoTick(delta);
            updateDynamicUI(); 
            updateQuestsUI();
            // STAGE 5: только text/style updates, без перестройки списка на tick.
            updateStage5UI();
            
            if(Date.now() - lastUfoSpawn >= 180000) { lastUfoSpawn = Date.now(); spawnUFO(); }
            
            if(currentTab === 'hq') {
                const rateEl = document.getElementById('market-rate-display');
                if(rateEl) rateEl.innerText = (calc.marketRate * 100).toFixed(2) + " Науки / 100 Мин";
                updateRebirthUIProgress(); 
            }
        }

        let targetPlanetScale = 1;

        function doClick(isManual, isAuto) {
            isManual = (isManual === undefined) ? true : isManual;
            isAuto = (isAuto === undefined) ? false : isAuto;
            if(isOverheated) return;
            if(state.res.min < 10 && isManual) {
                state.res.min += 1;
            }

            recalculate();
            state.res.min += calc.clickPower;
            addLifetimeMin(calc.clickPower);
            if(isManual) {
                state.stats.clicks++;
                // STAGE 5: несбрасываемый счётчик нужен достижениям и baseline задания.
                state.stats.totalClicks = (state.stats.totalClicks || 0) + 1;
            }

            if(isManual) {
                combo = Math.min(BALANCE.combo.max, combo + BALANCE.combo.gainPerClick);
                state.stats.maxCombo = Math.max(state.stats.maxCombo || 1, combo);
                comboTimer = BALANCE.combo.holdSeconds;
                updateComboUI();
                spawnFloatingText("+" + formatNum(calc.clickPower));
                spawnParticles();
                updateDynamicUI();
                
                targetPlanetScale = 1.05; 
                
                if (currentTab === 'hq') { updateHQStatsUI(); updateRebirthUIProgress(); }
                if (currentTab === 'quests') updateQuestsUI();
                playSFX('click');
            }

            if(!skillActive['freeze']) {
                heat += isAuto ? 1 : 4;
                if(heat >= calc.maxHeat) {
                    isOverheated = true;
                    combo = BALANCE.combo.min;
                    document.getElementById('heat-warning').classList.remove('hidden');
                }
            }
        }

        function updateHQStatsUI() {
            const clicksEl = document.getElementById('hq-stat-clicks');
            const minEl = document.getElementById('hq-stat-total-min');
            if(clicksEl) clicksEl.innerText = formatNum(state.stats.clicks);
            if(minEl) minEl.innerText = formatNum(state.stats.totalMin || 0);
        }

        function updateComboUI() {
            const el = document.getElementById('combo-display');
            el.innerText = "Комбо x" + combo.toFixed(1);
            el.style.opacity = combo > 1.0 ? '1' : '0';
            el.classList.remove('scale-110', 'scale-125', 'text-gold-400');
            if(combo > 2.0) {
                el.style.color = '#f59e0b';
                el.classList.add('scale-125', 'text-gold-400');
            } else if (combo > 1.5) {
                el.style.color = '#fde047';
                el.classList.add('scale-110');
            } else {
                el.style.color = '#fff';
            }
            const bar = document.getElementById('combo-bar');
            if(bar) {
                bar.style.opacity = combo > 1.0 ? '1' : '0';
                document.getElementById('combo-bar-fill').style.width = (Math.max(0, Math.min(1, comboTimer / BALANCE.combo.holdSeconds)) * 100) + '%';
            }
        }

        function updateHeatUI() {
            const fill = document.getElementById('heat-bar-fill');
            const pct = Math.min(100, (heat / calc.maxHeat) * 100);
            fill.style.width = pct + "%";
            const container = document.getElementById('heat-bar-container');
            const vignette = document.getElementById('vignette');
            
            if(pct > 85 && !isOverheated) {
                container.classList.add('overheat-flash');
                vignette.style.boxShadow = `inset 0 0 200px rgba(255, 0, 0, ${(pct-85)/15 * 0.8})`;
            } else if (isOverheated) {
                container.classList.remove('overheat-flash');
                vignette.style.boxShadow = `inset 0 0 300px rgba(255, 0, 0, 0.9)`;
            } else {
                container.classList.remove('overheat-flash');
                vignette.style.boxShadow = `inset 0 0 150px rgba(0, 0, 0, 0.8)`;
            }
        }

        function updateHeaderUI() {
            document.getElementById('ui-res-min').innerText = formatNum(displayState.res.min);
            document.getElementById('ui-rate-min').innerText = "+" + formatNum(calc.rate.min) + "/с";
            document.getElementById('ui-rate-min').classList.toggle('opacity-40', calc.rate.min <= 0);
            document.getElementById('ui-res-sci').innerText = formatNum(displayState.res.sci);
            document.getElementById('ui-rate-sci').innerText = "+" + formatNum(calc.rate.sci) + "/с";
            document.getElementById('ui-rate-sci').classList.toggle('opacity-40', calc.rate.sci <= 0);
            document.getElementById('ui-res-prm').innerText = formatNum(Math.round(displayState.res.prm));
            
            const dmContainer = document.getElementById('ui-dark-matter-container');
            if (state.rebirth && state.rebirth.darkMatter > 0) {
                dmContainer.classList.remove('hidden');
                dmContainer.classList.add('flex');
                document.getElementById('ui-res-dm').innerText = formatNum(Math.round(displayState.darkMatter));
            } else {
                dmContainer.classList.add('hidden');
                dmContainer.classList.remove('flex');
            }
            
            let crewMinBonus = 0, crewSciBonus = 0;
            CREW_DATA.forEach(char => {
                const lvl = state.crew[char.id] || 0;
                if(lvl > 0) {
                    if (char.rarity === 'common') crewMinBonus += 5 * lvl;
                    if (char.rarity === 'rare' && char.effect.includes('Наука')) crewSciBonus += 10 * lvl;
                    if (char.rarity === 'epic') { crewMinBonus += 50 * lvl; crewSciBonus += 50 * lvl; }
                }
            });
            
            const minEl = document.getElementById('ui-bonus-min');
            const sciEl = document.getElementById('ui-bonus-sci');
            
            if(crewMinBonus > 0) { minEl.innerText = `Экипаж: +${crewMinBonus}%`; minEl.classList.remove('hidden'); }
            if(crewSciBonus > 0) { sciEl.innerText = `Экипаж: +${crewSciBonus}%`; sciEl.classList.remove('hidden'); }
        }

        function toggleSkills() {
            state.skillsVisible = !state.skillsVisible;
            document.getElementById('skills-toggle-icon').className = state.skillsVisible ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
            if (state.skillsVisible) {
                initSkills();
                updateSkillsUI();
                playSFX('panel_open');
            } else {
                playSFX('panel_close');
                const container = document.getElementById('skills-container');
                const items = container.querySelectorAll(':scope > .skill-btn-wrapper');
                items.forEach((el, i) => {
                    el.style.animationDelay = (i * 0.04) + 's';
                    el.classList.remove('skill-in');
                    el.classList.add('skill-out');
                });
                setTimeout(() => {
                    if (!state.skillsVisible) container.innerHTML = '';
                }, 300 + items.length * 40);
            }
            saveGame();
        }

        function initSkills() {
            const container = document.getElementById('skills-container');
            if(!state.skillsVisible) { container.innerHTML = ''; return; }
            let html = '';
            for(let id in SKILLS) {
                const s = SKILLS[id];
                const isUnlocked = state.skillsUnlocked ? state.skillsUnlocked[id] : s.unlocked;
                if(isUnlocked) {
                    html += `
                    <div class="skill-btn-wrapper group">
                        <button id="skill-btn-${id}" onclick="castSkill('${id}')" class="skill-btn ${s.border} md:p-3 md:justify-start md:gap-3">
                            <div class="skill-cooldown-container">
                                <div id="skill-cd-${id}" class="skill-cooldown" style="height: 0%"></div>
                            </div>
                            <span class="ico ${s.icon} text-lg md:text-2xl ${s.color} z-10 relative drop-shadow-[0_0_8px_currentColor]"></span>
                            <div class="hidden md:flex flex-col items-start z-10 text-left leading-tight pointer-events-none w-full ml-1">
                                <span class="text-xs font-bold text-white whitespace-nowrap drop-shadow-md">${s.name}</span>
                                <span id="skill-status-${id}" class="text-[10px] text-gray-300 font-bold tracking-wide">Готово</span>
                                ${id === 'strike' ? '<span id="skill-hint-strike" class="skill-hint-hover text-[9px] text-mars-300/90 leading-snug mt-0.5">Нажми — мгновенно +15 минут добычи</span>' : ''}
                            </div>
                            <div class="skill-tooltip">

        function updateSkillsUI() {
            if(!state.skillsVisible) return;
            const now = Date.now();
            for(let id in SKILLS) {
                const s = SKILLS[id];
                const isUnlocked = state.skillsUnlocked ? state.skillsUnlocked[id] : s.unlocked;
                if(!isUnlocked) {
                    const prog = document.getElementById(`skill-prog-${id}`);
                    if(prog) {
                        const can = state.res.min >= s.cost;
                        prog.style.width = Math.min(100, (state.res.min / s.cost) * 100) + '%';
                        prog.classList.toggle('bg-mars-500', can);

                            priceEl.classList.toggle('text-mars-400', can);
                            priceEl.classList.toggle('text-gray-500', !can);
                        }
                    }
                    continue;
                }

                const cdTime = s.cd * 1000;
                const elapsed = now - (state.skills[id] || 0);
                const onCd = elapsed < cdTime;
                const cdPct = onCd ? 100 - (elapsed / cdTime) * 100 : 0;
                
                const btn = document.getElementById(`skill-btn-${id}`);
                const cdBar = document.getElementById(`skill-cd-${id}`);
                const statusTxt = document.getElementById(`skill-status-${id}`);

                        btn.classList.add('opacity-50', 'cursor-not-allowed', 'border-white/5');
                        btn.classList.remove(...s.border.split(' '));
                        
                        const remainingSec = Math.ceil((cdTime - elapsed) / 1000);
                        let timeStr = "";
                        if (remainingSec >= 60) {
                            const m = Math.floor(remainingSec / 60);
                            const sec = remainingSec % 60;
                            timeStr = `${m}м ${sec}с`;
                        } else {
                            timeStr = `${remainingSec}с`;

        function casinoSlotsRTP() {
            let triples = 0, pairs = 0;
            CASINO_CONFIG.slots.symbols.forEach(s => {
                const w = s.weight / 100;
                triples += Math.pow(w, 3) * s.mult3;
                pairs += 3 * w * w * (1 - w) * s.mult2;
            });
            return { rtp: triples + pairs, triples, pairs };
        }

        function casinoAudio() {

                if (_casinoCtx.state === 'suspended') _casinoCtx.resume();
                return _casinoCtx;
            } catch (e) { return null; }
        }
        function casinoTone(freq, dur, type, vol, delay, freqEnd) {
            const c = casinoAudio(); if (!c) return;
            try {
                const t0 = c.currentTime + (delay || 0);
                const o = c.createOscillator(), g = c.createGain();
                o.type = type || 'square';
                o.frequency.setValueAtTime(freq, t0);
                if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + dur);
                g.gain.setValueAtTime(vol || 0.06, t0);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                o.connect(g); g.connect(c.destination);
                o.start(t0); o.stop(t0 + dur + 0.02);
            } catch (e) {}
        }
        function casinoNoise(dur, vol, delay) {
            const c = casinoAudio(); if (!c) return;
            try {
                const len = Math.floor(c.sampleRate * dur);
                const buf = c.createBuffer(1, len, c.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
                const src = c.createBufferSource(); src.buffer = buf;
                const f = c.createBiquadFilter(); f.type = 'lowpass';
                const t0 = c.currentTime + (delay || 0);
                f.frequency.setValueAtTime(1200, t0);
                f.frequency.exponentialRampToValueAtTime(80, t0 + dur);
                const g = c.createGain();
                g.gain.setValueAtTime(vol || 0.25, t0);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                src.connect(f); f.connect(g); g.connect(c.destination);
                src.start(t0);
            } catch (e) {}
        }

            state.prestige.cores = (state.prestige.cores || 0) + formulaAward + adAward;
            state.prestige.formulaCores = (state.prestige.formulaCores || 0) + formulaAward;

        function buyBld(id) {
            let crewCostDiscount = 0;
            CREW_DATA.forEach(c => { if(c.rarity==='rare' && c.effect.includes('Скидка')) crewCostDiscount += 0.02 * (state.crew[c.id] || 0); });
            let costMultGlobal = Math.max(0.1, 1 - crewCostDiscount);

            const d = BLD_DATA[id], lvl = state.bld[id] || 0;
            let cost = (d.base.min * Math.pow(d.costMult, lvl)) * costMultGlobal;
            if(state.res.min >= cost) { 
                state.res.min -= cost; 
                state.bld[id] = lvl + 1;
                // STAGE 5: единый lifetime-счётчик покупок зданий/апгрейдов.
                state.stats.upgradePurchases = (state.stats.upgradePurchases || 0) + 1;
                recalculate(); 
                saveGame();
                switchTab('build'); 
                playSFX('buy');
            } else {
                playSFX('error');
            }
        }

        function watchAd(type) {
            showRewardedVideo(success => {
                if (!success) {
                    showToast("Реклама не досмотрена до конца. Награда не выдана.");
                    return;
                }
                if (type === 'min') {
                    const amount = Math.max(100, calc.rate.min * 1800); 
                    state.res.min += amount;
                    addLifetimeMin(amount);
                    showToast("Спонсорская помощь: +" + formatNum(amount) + " Мин.");
                } else if (type === 'sci') {
                    const amount = Math.max(10, calc.rate.sci * 1800); 
                    state.res.sci += amount;
                    showToast("Грант получен: +" + formatNum(amount) + " Науки.");
                } else if (type === 'prm') {
                    state.res.prm += 15;
                    showToast("Найден тайник: +15 Кристаллов!");
                } else if (type === 'cd') {
                    for (let id in state.skills) {
                        state.skills[id] = 0; 
                    }
                    updateSkillsUI();
                    showToast("Перезарядка всех навыков обнулена!");
                } else if (type === 'buff') {
                    adBuffTimer += 300; 
                    recalculate();
                    showToast("Турбо-режим активирован на 5 минут!");
                }

                playSFX('epic');
                saveGame();
                updateHeaderUI();
                updateDynamicUI();
                closeModal();
                
                const f = document.createElement('div');
                f.className = 'fixed inset-0 bg-green-500 z-50 mix-blend-overlay opacity-100 pointer-events-none transition-opacity duration-500';
                document.body.appendChild(f);
                setTimeout(() => f.style.opacity = '0', 50);
                setTimeout(() => f.remove(), 550);
            });
        }

        // STAGE 4: локальные календарные ключи сравниваются через UTC-порядковый номер даты,
        // поэтому переходы месяца/года не зависят от длины суток и смены часового пояса/DST.
        function localDateKey(value = Date.now()) {
            const date = value instanceof Date ? value : new Date(value);
            if (!Number.isFinite(date.getTime())) return null;
            const pad = number => String(number).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
        }

        function normalizeDailyDateKey(value) {
            if (!value) return null;
            if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
            const numeric = Number(value);
            const date = Number.isFinite(numeric) && numeric > 0 ? new Date(numeric) : new Date(value);
            return Number.isFinite(date.getTime()) ? localDateKey(date) : null;
        }

        function dailyOrdinal(dateKey) {
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateKey || '');
            return match ? Math.floor(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])) / 86400000) : null;
        }

        function dailyDateDistance(fromKey, toKey) {
            const from = dailyOrdinal(fromKey);
            const to = dailyOrdinal(toKey);
            return from === null || to === null ? null : to - from;
        }

        function prepareDailyReward(now = Date.now()) {
            state.daily = state.daily || { streak: 0, lastClaimDate: null, lastClaimDay: null, currentDay: 1, pending: null };
            const daily = state.daily;
            const today = localDateKey(now);
            daily.lastClaimDate = normalizeDailyDateKey(daily.lastClaimDate);
            if (!today || daily.lastClaimDate === today) {
                daily.pending = null;
                return;
            }
            if (daily.pending && daily.pending.date === today) return;

            const distance = dailyDateDistance(daily.lastClaimDate, today);
            const day = distance === 1 ? ((Math.max(0, Number(daily.streak) || 0) % 7) + 1) : 1;
            const config = BALANCE.daily.rewards[day - 1];
            const mineralRate = Math.max(0, Number(calc.rate.min) || 0);
            daily.currentDay = day;
            daily.pending = {
                date: today,
                day,
                reward: {
                    min: Math.max(config.minFloor, mineralRate * config.incomeSeconds),
                    prm: config.crystals,
                    cores: config.cores
                }
            };
            saveGame();
        }

        function claimDailyReward(withRewarded) {
            const today = localDateKey();
            const pending = state.daily && state.daily.pending;
            if (dailyClaimLocked || !pending || pending.date !== today || state.daily.lastClaimDate === today) return;
            dailyClaimLocked = true;

            let settled = false;
            const finish = multiplier => {
                if (settled) return;
                settled = true;
                const current = state.daily && state.daily.pending;
                if (!current || current.date !== today || state.daily.lastClaimDate === today) return;
                const reward = current.reward || { min: 0, prm: 0, cores: 0 };
                state.daily.pending = null;
                state.daily.streak = current.day;
                state.daily.currentDay = current.day;
                state.daily.lastClaimDay = current.day;
                state.daily.lastClaimDate = today;
                state.res.min += reward.min * multiplier;
                state.res.prm += reward.prm * multiplier;
                state.prestige.cores = (state.prestige.cores || 0) + reward.cores;
                addLifetimeMin(reward.min * multiplier);
                saveGame();
                updateHeaderUI();
                closeModal();
                dailyClaimLocked = false;
                showToast(`День ${current.day}: ежедневная награда x${multiplier} получена`);
                playSFX('epic');
            };
            if (!withRewarded) { finish(1); return; }
            showRewardedVideo(success => {
                if (success) finish(BALANCE.daily.rewardedMultiplier);

            });

        // STAGE 3: одноразовая модалка; награда находится в save до атомарного claim.
        function formatOfflineDuration(seconds) {
            const total = Math.max(0, Math.floor(seconds));
            const hours = Math.floor(total / 3600);
            const mins = Math.floor((total % 3600) / 60);
            const secs = total % 60;
            return [hours ? `${hours} ч` : '', mins ? `${mins} мин` : '', (!hours && secs) ? `${secs} сек` : ''].filter(Boolean).join(' ');
        }

        function updateRebirthUIProgress() {
            let totalMin = state.stats.totalMin || 0;
            let calcDM = calculateDM(totalMin);
            let nextDMCost = calculateDMCost(calcDM + 1);
            let prevDMCost = calculateDMCost(calcDM);
            let progress = totalMin - prevDMCost;
            let req = nextDMCost - prevDMCost;
            let pct = Math.min(100, Math.max(0, (progress / req) * 100));
            
            const bar = document.getElementById('rebirth-progress-bar');
            if (bar) bar.style.width = pct + "%";
            
            const reqText = document.getElementById('rebirth-next-req');
            if (reqText) {
                let remaining = nextDMCost - totalMin;
                reqText.innerHTML = `До следующей ТМ нужно: <span class="text-white">${formatNum(remaining)}</span> минералов`;
            }
        }

        function confirmRebirth() {

            content.innerHTML = `

                    <p class="text-base text-purple-400 font-bold mb-8 drop-shadow-[0_0_5px_rgba(168,85,247,0.8)]">Взамен вы получите +${formatNum(calcDM)} Тёмной Материи<br><span class="text-[10px] text-gray-400 font-normal uppercase tracking-widest mt-2 block">(Экипаж, Кристаллы и Планеты сохранятся)</span></p>
                    <div class="flex gap-4">

                        <button onclick="doRebirth()" class="flex-1 bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white py-4 rounded-xl font-bold transition-all shadow-[0_0_25px_rgba(168,85,247,0.6)] btn-shine border border-purple-400">Переродиться</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function doRebirth() {
            const calcDM = calculateDM(state.stats.totalMin || 0);
            if (calcDM <= 0) return;
            if(!state.rebirth) state.rebirth = { count: 0, darkMatter: 0 };
            state.rebirth.count++;
            state.rebirth.darkMatter += calcDM;

            state.res.min = 0;
            state.res.sci = 0;
            state.bld = {};
            state.tech = {};
            state.stats.clicks = 0;
            state.stats.totalMin = 0; 
            state.skills = { strike: 0, freeze: 0, swarm: 0, coolant: 0, overdrive: 0, timewarp: 0 };
            state.questsCompleted = {}; 
            heat = 0;
            isOverheated = false;
            
            playSFX('epic');
            saveGame();
            if (ysdk && ysdk.player) { try { ysdk.player.setData({ save: JSON.stringify(state) }); } catch(e) {} }
            submitLeaderboard();
            
            const f = document.createElement('div');
            f.className = 'fixed inset-0 bg-white z-50 transition-opacity duration-1000';
            f.style.opacity = '0';
            document.body.appendChild(f);
            
            setTimeout(() => { f.style.opacity = '1'; }, 50);
            setTimeout(() => location.reload(), 1000); 
        }

        function tradeMarketCustom() {
            const input = document.getElementById('market-input');
            const amount = Math.floor(parseFloat(input.value));
            
            if(isNaN(amount) || amount < 100) {
                showToast("Минимум 100 минералов для обмена!");
                playSFX('error');
                return;
            }
            if(amount > state.res.min) {
                showToast("Недостаточно минералов на балансе!");
                playSFX('error');
                return;
            }
            
            state.res.min -= amount;
            let sciGained = amount * calc.marketRate;
            state.res.sci += sciGained;
            
            showToast(`Успешно: +${formatNum(sciGained)} Науки`);
            playSFX('buy');
            input.value = ''; 
            saveGame();
            updateHeaderUI();
        }

        function marketMax() {
            const input = document.getElementById('market-input');
            if (!input) return;
            const amt = Math.floor(state.res.min);
            if (amt < 100) {
                showToast("Минимум 100 минералов для обмена!");
                playSFX('error');
                return;
            }
            input.value = amt;
            tradeMarketCustom();
        }

        // STAGE 5: прогресс достижений всегда вычисляется из сохранённой статистики.
        function achievementProgress(a) {
            if (a.type === 'clicks') return state.stats.totalClicks || state.stats.clicks || 0;
            if (a.type === 'lifetime') return state.stats.totalLifetime || 0;
            if (a.type === 'upgrades') return state.stats.upgradePurchases || 0;
            if (a.type === 'casino') return state.casino?.stats?.spins || 0;
            if (a.type === 'prestige') return state.prestige?.count || 0;
            if (a.type === 'combo') return state.stats.maxCombo || 1;
            return 0;
        }

        let achievementClaimLocked = false;
        let achievementCategory = 'Все';
        function readyAchievementCount() {
            const claimed = state.achievements?.claimed || {};
            return BALANCE.achievements.filter(a => !claimed[a.id] && achievementProgress(a) >= a.target).length;
        }

        function updateAchievementBadge() {
            const count = readyAchievementCount();
            const badge = document.getElementById('achievement-ready-badge');
            if (!badge) return;
            badge.textContent = count;
            badge.classList.toggle('hidden', count === 0);

        function openAchievementsModal(category = achievementCategory) {

                    ${got ? '<span class="text-green-500 text-xs font-bold">ПОЛУЧЕНО</span>' : done ? `<button onclick="claimAchievement('${a.id}', this)" class="shrink-0 px-3 py-2 rounded-lg bg-green-600 hover:bg-green-500 text-white text-xs font-bold">Забрать +${a.reward} <span class="ico ico-crystal"></span></button>` : `<span class="text-prem-300 text-xs font-bold">+${a.reward} <span class="ico ico-crystal"></span></span>`}</div>
                    <div class="h-1.5 rounded-full bg-black/70 mt-2 overflow-hidden"><div class="h-full ${done ? 'bg-green-500' : 'bg-gold-500'}" style="width:${pct}%"></div></div>
                </div>`;
            }).join('');
            content.innerHTML = `<div class="flex justify-between items-center border-b border-white/10 pb-4 mb-3"><div><h3 class="font-orbitron font-black text-xl text-gold-300"><i class="fa-solid fa-trophy mr-2"></i>ДОСТИЖЕНИЯ</h3><div class="text-[10px] text-gray-500 uppercase">24 награды за развитие колонии</div></div><button onclick="closeModal()" class="w-10 h-10 rounded-full bg-white/5"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="flex gap-2 overflow-x-auto pb-3">${categories.map(c => `<button onclick="openAchievementsModal('${c}')" class="shrink-0 px-3 py-1.5 rounded-lg text-[10px] font-bold border ${c === category ? 'bg-gold-500/20 border-gold-400 text-gold-300' : 'bg-white/5 border-white/10 text-gray-400'}">${c}</button>`).join('')}</div>
                <div class="overflow-y-auto pr-1 space-y-2">${items}</div>`;
            modal.classList.remove('hidden');
        }

        function claimAchievement(id, button) {
            if (achievementClaimLocked) return;
            const a = BALANCE.achievements.find(x => x.id === id);
            if (!a || state.achievements.claimed[id] || achievementProgress(a) < a.target) return;
            achievementClaimLocked = true;
            if (button) button.disabled = true;
            state.achievements.claimed[id] = true;
            state.res.prm += a.reward;
            saveGame(); updateHeaderUI(); updateAchievementBadge(); playSFX('epic');
            showToast(`Достижение «${a.name}»: +${a.reward} кристаллов`);
            achievementClaimLocked = false;
            openAchievementsModal(achievementCategory);
        }

        // STAGE 5: стабильный seeded-выбор трёх разных типов на локальную дату.
        function stage5Hash(text) {
            let h = 2166136261;
            for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
            return h >>> 0;
        }
        function stage5Counter(type) {
            if (type === 'clicks') return state.stats.totalClicks || 0;
            if (type === 'mined') return state.stats.totalLifetime || 0;
            if (type === 'casino') return state.casino?.stats?.spins || 0;
            if (type === 'upgrades') return state.stats.upgradePurchases || 0;
            return 0;
        }
        function prepareDailyTasks(now = Date.now()) {
            const date = localDateKey(now);
            if (!date || (state.dailyTasks?.date === date && state.dailyTasks.tasks?.length === BALANCE.dailyTasks.count)) return;
            const templates = [...BALANCE.dailyTasks.templates];
            let seed = stage5Hash(date);
            for (let i = templates.length - 1; i > 0; i--) { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; const j = seed % (i + 1); [templates[i], templates[j]] = [templates[j], templates[i]]; }
            const income = Math.max(1, Number(calc.rate.min) || 1);
            const progressScale = Math.log10(Math.max(10, state.stats.totalLifetime || 10));
            const tasks = templates.slice(0, BALANCE.dailyTasks.count).map((t, i) => {
                let target;
                if (t.type === 'mined') target = Math.round(Math.min(t.max, Math.max(t.min, income * t.incomeSeconds)));
                else target = Math.round(Math.min(t.max, Math.max(t.min, t.base * (1 + progressScale * t.scale))));
                const rewardMin = Math.round(Math.max(BALANCE.dailyTasks.rewards.mineralFloor[i], income * BALANCE.dailyTasks.rewards.incomeSeconds[i]));
                return { id: `${date}:${t.type}`, type: t.type, label: t.label, target, baseline: stage5Counter(t.type), progress: 0, claimed: false, reward: { prm: BALANCE.dailyTasks.rewards.crystals[i], min: rewardMin } };
            });
            state.dailyTasks = { ...(state.dailyTasks || {}), date, tasks };
            saveGame();
        }
        function dailyTaskProgress(task) { return Math.min(task.target, Math.max(task.progress || 0, stage5Counter(task.type) - task.baseline)); }
        let dailyTaskClaimLocked = false;
        function claimDailyTask(id, button) {
            if (dailyTaskClaimLocked) return;
            const task = state.dailyTasks?.tasks?.find(x => x.id === id);
            if (!task || task.claimed || dailyTaskProgress(task) < task.target) return;
            dailyTaskClaimLocked = true; if (button) button.disabled = true;
            task.progress = dailyTaskProgress(task); task.claimed = true;
            state.res.prm += task.reward.prm; state.res.min += task.reward.min; addLifetimeMin(task.reward.min);
            saveGame(); updateHeaderUI(); updateStage5UI(true); playSFX('epic');
            showToast(`Задание выполнено: +${task.reward.prm} крист., +${formatNum(task.reward.min)} мин.`);
            dailyTaskClaimLocked = false;
        }
        function renderDailyTasks() {
            prepareDailyTasks();
            return `<div class="mb-6"><div class="flex justify-between items-end mb-3"><div><div class="font-orbitron font-black text-sm text-white">ЕЖЕДНЕВНЫЕ ЗАДАНИЯ</div><div class="text-[10px] text-gray-500">Новый набор после 00:00 · ${state.dailyTasks.date}</div></div></div><div class="space-y-3">${state.dailyTasks.tasks.map(task => {
                const progress = dailyTaskProgress(task), done = progress >= task.target, pct = Math.min(100, progress / task.target * 100);
                return `<div id="daily-task-${task.type}" class="glass-card rounded-xl p-4 border ${done && !task.claimed ? 'border-green-500/50' : 'border-white/10'}"><div class="flex justify-between gap-3"><div class="min-w-0"><div class="font-bold text-white">${task.label}: ${formatNum(task.target)}</div><div id="daily-task-progress-${task.type}" class="text-[11px] text-gray-400">${formatNum(progress)} / ${formatNum(task.target)}</div><div class="text-[10px] text-prem-300 mt-1">+${task.reward.prm} крист. · +${formatNum(task.reward.min)} мин.</div></div>${task.claimed ? '<span class="text-green-500 font-bold text-xs">ПОЛУЧЕНО</span>' : `<button id="daily-task-btn-${task.type}" onclick="claimDailyTask('${task.id}', this)" ${done ? '' : 'disabled'} class="shrink-0 px-3 py-2 rounded-lg text-xs font-bold ${done ? 'bg-green-600 text-white' : 'bg-white/5 text-gray-600'}">Забрать</button>`}</div><div class="h-1.5 rounded-full bg-black/60 overflow-hidden mt-3"><div id="daily-task-bar-${task.type}" class="h-full bg-gradient-to-r from-green-600 to-green-400" style="width:${pct}%"></div></div></div>`;
            }).join('')}</div></div>`;
        }
        function updateStage5UI(force = false) {
            prepareDailyTasks(); updateAchievementBadge();
            const tasks = state.dailyTasks?.tasks || [];
            let ready = 0;
            tasks.forEach(task => {
                const progress = dailyTaskProgress(task), done = progress >= task.target;
                // STAGE 5: snapshot progress сохраняется вместе с baseline/claimed/date на ближайшем autosave.
                task.progress = progress;
                if (done && !task.claimed) ready++;
                const text = document.getElementById(`daily-task-progress-${task.type}`); if (text) text.textContent = `${formatNum(progress)} / ${formatNum(task.target)}`;
                const bar = document.getElementById(`daily-task-bar-${task.type}`); if (bar) bar.style.width = Math.min(100, progress / task.target * 100) + '%';
                const btn = document.getElementById(`daily-task-btn-${task.type}`); if (btn) { btn.disabled = !done; btn.className = `shrink-0 px-3 py-2 rounded-lg text-xs font-bold ${done ? 'bg-green-600 text-white' : 'bg-white/5 text-gray-600'}`; }
            });
            const badge = document.getElementById('tab-badge-quests'); if (badge) { badge.textContent = ready; badge.classList.toggle('hidden', ready === 0); badge.classList.toggle('flex', ready > 0); }
            if (force && currentTab === 'quests') switchTab('quests');
        }

        function renderQuests(container) {

                    <div id="quest-bar-${q.id}" class="absolute bottom-0 left-0 h-1.5 bg-gradient-to-r from-green-600 to-green-400 transition-all duration-500 shadow-[0_0_10px_rgba(74,222,128,0.8)]" style="width: 0%"></div>
                    
                    <div class="flex-1 min-w-0 pr-2 z-10 relative">
                        <div class="text-sm font-bold ${isClaimed ? 'text-gray-600 line-through' : 'text-white'} tracking-wide truncate">${q.name}</div>

                    </div>
                    
                    ${isClaimed ? 
                        `<div class="w-10 h-10 shrink-0 rounded-full bg-green-900/30 flex items-center justify-center border border-green-500/20 z-10 relative"><span class="text-green-500 text-xl font-bold"><i class="fa-solid fa-check"></i></span></div>` : 
                        `<button id="quest-btn-${q.id}" onclick="claimQuest('${q.id}')" class="shrink-0 px-4 py-2 rounded-lg text-xs font-bold bg-white/5 text-gray-500 transition-all active:scale-95 z-10 relative w-[80px]" disabled>
                            Забрать<br><span class="flex items-center justify-center gap-1 mt-0.5">${q.reward.prm} <span class="ico ico-crystal text-[10px]"></span></span>
                        </button>`
                    }
                </div>`;

            container.innerHTML = html + '</div>';

        function updateQuestsUI() {
            if(currentTab !== 'quests') return;
            
            QUESTS.forEach(q => {
                let isClaimed = state.questsCompleted[q.id];

                let progress = 0;
                if(q.type === 'clicks') progress = state.stats.clicks;
                if(q.type === 'min') progress = state.stats.totalMin || state.res.min;
                if(q.type === 'tech') progress = Object.keys(state.tech).length;
                if(q.type === 'crew') progress = Object.values(state.crew).reduce((a,b)=>a+b, 0);
                
                let isDone = progress >= q.target;
                let pct = Math.min(100, (progress / q.target) * 100);
                
                const card = document.getElementById(`quest-card-${q.id}`);
                const bar = document.getElementById(`quest-bar-${q.id}`);
                const desc = document.getElementById(`quest-desc-${q.id}`);
                const btn = document.getElementById(`quest-btn-${q.id}`);
                
                if(card) {
                    if(isClaimed) { card.style.order = 3; card.style.opacity = '0.5'; }
                    else if(isDone) { card.style.order = 1; card.style.opacity = '1'; }
                    else { card.style.order = 2; card.style.opacity = '1'; }
                }
                
                if(isClaimed) return;
                
                if(bar) bar.style.width = pct + "%";
                if(desc) desc.innerText = `${q.desc} (${formatNum(progress)} / ${formatNum(q.target)})`;
                
                if(btn) {
                    if(isDone && btn.disabled) {
                        btn.disabled = false;
                        btn.className = "shrink-0 px-4 py-2 rounded-lg text-xs font-bold bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white shadow-[0_0_15px_rgba(34,197,94,0.5)] transition-all active:scale-95 btn-shine border border-green-400 z-10 relative w-[80px]";
                    } else if(!isDone && !btn.disabled) {
                        btn.disabled = true;
                        btn.className = "shrink-0 px-4 py-2 rounded-lg text-xs font-bold bg-white/5 text-gray-500 transition-all border border-white/5 z-10 relative w-[80px]";
                    }
                }
            });
        }

        function claimQuest(id) {
            const q = QUESTS.find(x => x.id === id);
            if(!q) return;

                state.rebirth.darkMatter -= p.cost;
                state.unlockedPlanets[id] = true;
                playSFX('epic');
                saveGame();
                switchTab('planets');
                showToast(`Открыт новый мир: ${p.name}!`);
                updateHeaderUI();
                
                const f = document.createElement('div');
                f.className = 'fixed inset-0 bg-purple-500 z-50 mix-blend-overlay opacity-100 pointer-events-none transition-opacity duration-500';
                document.body.appendChild(f);
                setTimeout(() => f.style.opacity = '0', 50);
                setTimeout(() => f.remove(), 550);

                playSFX('error');
            }

        let _badgeCache = '';
        function updateTabBadges() {
            let crewCostDiscount = 0;
            CREW_DATA.forEach(c => { if(c.rarity==='rare' && c.effect.includes('Скидка')) crewCostDiscount += 0.02 * (state.crew[c.id] || 0); });
            const cmg = Math.max(0.1, 1 - crewCostDiscount);
            let b = false;
            for(const id in BLD_DATA) { const d = BLD_DATA[id]; if(state.res.min >= d.base.min * Math.pow(d.costMult, state.bld[id] || 0) * cmg) { b = true; break; } }
            let t = false;
            for(const key in TECH_DATA) { const x = TECH_DATA[key]; if(!state.tech[key] && (!x.req || state.tech[x.req]) && state.res.sci >= x.cost) { t = true; break; } }
            let c = false;
            CREW_DATA.forEach(ch => {
                const lvl = state.crew[ch.id] || 0;
                if(lvl === 0 && state.res.prm >= ch.cost) c = true;
                else if(lvl > 0 && state.res.sci >= lvl * 50) c = true;
            });
            let p = false;
            for(const id in PLANETS) { if(!state.unlockedPlanets[id] && (state.rebirth?.darkMatter || 0) >= PLANETS[id].cost) { p = true; break; } }
            let cs = false;
            if (typeof casinoUnlocked === 'function' && casinoUnlocked()) {
                const freeWheel = (Date.now() - (state.casino.wheelLastFree || 0)) >= CASINO_CONFIG.wheel.freeCdMs;
                cs = freeWheel || !state.casino.visited;
            }
            const sig = `${b}|${t}|${c}|${p}|${cs}`;
            if(sig === _badgeCache) return;
            _badgeCache = sig;
            [['build', b], ['tech', t], ['crew', c], ['planets', p], ['casino', cs]].forEach(([n, v]) => {
                const el = document.getElementById(`tab-badge-${n}`);
                if(el) el.classList.toggle('hidden', !v);
            });
        }

        function updateDynamicUI() {
            if(currentTab === 'build') {
                let crewCostDiscount = 0;
                CREW_DATA.forEach(c => { if(c.rarity==='rare' && c.effect.includes('Скидка')) crewCostDiscount += 0.02 * (state.crew[c.id] || 0); });
                let costMultGlobal = Math.max(0.1, 1 - crewCostDiscount);

                for (let id in BLD_DATA) {
                    const btn = document.getElementById(`btn-bld-${id}`);
                    if(btn) {
                        const d = BLD_DATA[id], lvl = state.bld[id] || 0;
                        let cost = (d.base.min * Math.pow(d.costMult, lvl)) * costMultGlobal;
                        if(state.res.min >= cost) {
                            btn.disabled = false;
                            btn.classList.remove('bg-white/5', 'text-gray-500');
                            btn.classList.add(d.isSci ? 'bg-sci-600' : 'bg-mars-600', 'text-white', 'shadow-[0_0_15px_rgba(255,255,255,0.1)]', 'hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]');
                        } else {
                            btn.disabled = true;
                            btn.classList.add('bg-white/5', 'text-gray-500');
                            btn.classList.remove('bg-sci-600', 'bg-mars-600', 'text-white', 'shadow-[0_0_15px_rgba(255,255,255,0.1)]', 'hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]');
                        }
                    }
                }
            } else if (currentTab === 'tech') {
                for (let key in TECH_DATA) {

                        const t = TECH_DATA[key];

                        }

        function adminAddRes(type) {
            const val = parseFloat(document.getElementById('admin-add-' + type).value) || 0;
            if (val <= 0) return;
            
            if (type === 'min') {
                state.res.min += val;
                addLifetimeMin(val);
            } else if (type === 'sci') {
                state.res.sci += val;
            } else if (type === 'prm') {
                state.res.prm += val;
            } else if (type === 'dm') {
                if(!state.rebirth) state.rebirth = { count: 0, darkMatter: 0 };
                state.rebirth.darkMatter += val;
                recalculate();
            }
            
            updateHeaderUI();
            saveGame();
            showToast("Ресурсы выданы!");
            playSFX('epic');
            
            if (currentTab === 'hq') updateHQStatsUI();
            updateDynamicUI();
            if (currentTab === 'quests') updateQuestsUI();
        }
