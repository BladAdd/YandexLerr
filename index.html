        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020408, 0.025);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 22;
            
            const initialCamX = window.innerWidth > 768 ? -6 : 0;
            camera.position.x = initialCamX;
            targetCameraX = initialCamX;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const aLight = new THREE.AmbientLight(0xffffff, 0.15); scene.add(aLight);
            const pLight = new THREE.PointLight(0xffeedd, 1.8, 100);
            pLight.position.set(12, 5, 15); scene.add(pLight);
            
            rimLight = new THREE.DirectionalLight(0xE55934, 1.5);
            rimLight.position.set(-10, -5, -10);
            scene.add(rimLight);
            
            const geo = new THREE.SphereGeometry(8, 64, 64);
            marsMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x8a2610, roughness: 0.7, metalness: 0.2 }));
            scene.add(marsMesh);
            
            atmosMesh = new THREE.Mesh(new THREE.SphereGeometry(8.3, 32, 32), new THREE.MeshBasicMaterial({ color: 0xE55934, transparent: true, opacity: 0.2, side: THREE.BackSide, blending: THREE.AdditiveBlending }));
            scene.add(atmosMesh);

            wireMesh = new THREE.Mesh(new THREE.SphereGeometry(8.4, 16, 16), new THREE.MeshBasicMaterial({ color: 0xE55934, wireframe: true, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending }));
            scene.add(wireMesh);

            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 128, 128);
            const tex = new THREE.CanvasTexture(canvas);
            
            sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: 0xE55934, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending }));
            sunGlow.scale.set(40, 40, 1);
            sunGlow.position.set(0, 0, -10);
            scene.add(sunGlow);

            const ringGeo = new THREE.BufferGeometry();
            const ringPos = new Float32Array(5000 * 3);
            for(let i=0; i<5000; i++) {
                const a = Math.random() * Math.PI * 2;
                const r = 11 + Math.random() * 4;
                ringPos[i*3] = Math.cos(a) * r;
                ringPos[i*3+1] = (Math.random() - 0.5) * 0.5;
                ringPos[i*3+2] = Math.sin(a) * r;
            }
            ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
            ringsMesh = new THREE.Points(ringGeo, new THREE.PointsMaterial({ size: 0.05, color: 0xE55934, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
            ringsMesh.rotation.x = Math.PI / 2.5;
            scene.add(ringsMesh);

            const pgeo = new THREE.SphereGeometry(0.8, 56, 40);
            const pRand = (function(){ let s = 1337; return function(){ s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
            const craters = [];
            for(let i = 0; i < 16; i++) {
                craters.push({ dir: new THREE.Vector3(pRand() * 2 - 1, pRand() * 2 - 1, pRand() * 2 - 1).normalize(), ang: 0.14 + pRand() * 0.30, depth: 0.05 + pRand() * 0.09, rim: 0.015 + pRand() * 0.03 });
            }
            const pPos = pgeo.attributes.position;
            const pCol = new Float32Array(pPos.count * 3);
            const pn = new THREE.Vector3();
            for(let i = 0; i < pPos.count; i++) {
                pn.fromBufferAttribute(pPos, i).normalize();
                let disp = 1;
                let craterShade = 0;
                for(const c of craters) {
                    const d = pn.dot(c.dir);
                    if(d > Math.cos(c.ang)) {
                        const t = Math.acos(Math.min(1, d)) / c.ang;
                        const bowl = Math.cos(t * Math.PI) * 0.5 + 0.5;
                        disp -= c.depth * bowl;
                        disp += c.rim * Math.exp(-Math.pow((t - 0.85) / 0.12, 2));
                        craterShade += bowl;
                    }
                }
                const r = 0.8 * disp;
                pPos.setXYZ(i, pn.x * r, pn.y * r, pn.z * r);
                const sh = Math.max(0.55, Math.min(1.12, 0.92 - craterShade * 0.35));
                pCol[i*3] = 0.60 * sh; pCol[i*3+1] = 0.54 * sh; pCol[i*3+2] = 0.48 * sh;
            }
            pgeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
            pgeo.computeVertexNormals();
            phobosMesh = new THREE.Mesh(pgeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1.0, metalness: 0.05 }));
            scene.add(phobosMesh);

            const sGeo = new THREE.BufferGeometry();
            const sPos = new Float32Array(3000 * 3);
            const sColors = new Float32Array(3000 * 3);
            const color = new THREE.Color();
            for(let i=0; i<3000; i++) {
                sPos[i*3] = (Math.random() - 0.5) * 150;
                sPos[i*3+1] = (Math.random() - 0.5) * 150;
                sPos[i*3+2] = (Math.random() - 0.5) * 150 - 20;
                
                color.setHSL(Math.random() * 0.2 + 0.5, 0.8, Math.random() * 0.5 + 0.5); 
                sColors[i*3] = color.r; sColors[i*3+1] = color.g; sColors[i*3+2] = color.b;
            }
            sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
            sGeo.setAttribute('color', new THREE.BufferAttribute(sColors, 3));
            
            const starMat = new THREE.PointsMaterial({ size: 0.18, map: tex, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
            const stars = new THREE.Points(sGeo, starMat);
            scene.add(stars);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                const baseCamX = window.innerWidth > 768 ? -6 : 0;
                targetCameraX = baseCamX;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                resizeCanvas();
            });
            
            // Mouse Parallax effect
            document.addEventListener('mousemove', (e) => {
                const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                const baseCamX = window.innerWidth > 768 ? -6 : 0;
                targetCameraX = baseCamX + mouseX * 1.5;
                targetCameraY = mouseY * 1.5;
            });

            animate3D();
        }

        let phobosAngle = 0;
        let currentPlanetScale = 1;

        function animate3D() {
            requestAnimationFrame(animate3D);
            
            if(marsMesh) marsMesh.rotation.y += 0.0004;
            if(atmosMesh) atmosMesh.rotation.y += 0.0006;
            if(wireMesh) {
                wireMesh.rotation.y += 0.0008;
                wireMesh.rotation.x += 0.0002;
            }
            if(ringsMesh) ringsMesh.rotation.z -= 0.0005;
            
            targetPlanetScale += (1 - targetPlanetScale) * 0.05; 
            currentPlanetScale += (targetPlanetScale - currentPlanetScale) * 0.15; 
            if(marsMesh) marsMesh.scale.setScalar(currentPlanetScale);
            if(atmosMesh) atmosMesh.scale.setScalar(currentPlanetScale);
            if(wireMesh) wireMesh.scale.setScalar(currentPlanetScale);
            
            if(phobosMesh) {
                phobosAngle += 0.0015;
                const s = currentPlanetScale;
                const orb = Math.min(1, Math.max(0.55, (window.innerWidth / window.innerHeight) / 1.5));
                const A = 11.2 * s * orb;
                const B = 9.6 * s * orb;
                const tilt = 25 * Math.PI / 180;
                phobosMesh.position.x = Math.cos(phobosAngle) * A;
                phobosMesh.position.z = Math.sin(phobosAngle) * B * Math.cos(tilt);
                phobosMesh.position.y = Math.sin(phobosAngle) * B * Math.sin(tilt);
                phobosMesh.scale.setScalar(s);
                phobosMesh.rotation.y += 0.01;
                phobosMesh.rotation.x += 0.005;
            }
            
            camera.position.x += (targetCameraX - camera.position.x) * 0.05;
            camera.position.y += (targetCameraY - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0); 
            
            renderer.render(scene, camera);
        }

        const uiCanvas = document.getElementById('ui-particles');
        const ctx = uiCanvas.getContext('2d');
        let floaters = [];
        let particles = [];

        function resizeCanvas() { uiCanvas.width = window.innerWidth; uiCanvas.height = window.innerHeight; }
        
        function spawnFloatingText(text) {
            const rect = document.getElementById('main-clicker').getBoundingClientRect();
            const angle = Math.random() * Math.PI * 2;
            const r = rect.width/2 - 20;
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            
            floaters.push({
                x: cx + Math.cos(angle)*r,
                y: cy + Math.sin(angle)*r,
                vx: Math.cos(angle) * (Math.random()*1+1.5),
                vy: Math.sin(angle) * (Math.random()*1+1) - 2.5,
                text: text,
                life: 1.0,
                scale: 0.5
            });
        }
        
        function spawnParticles() {
            const rect = document.getElementById('main-clicker').getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const p = PLANETS[state.planet || 'mars'];
            
            for(let i=0; i<6; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 2;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
                    life: 1.0,
                    size: Math.random() * 3 + 1,
                    color: p.color.replace('text-', '') 
                });
            }
        }

        function animateCanvas() {
            requestAnimationFrame(animateCanvas);
            ctx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            
            for(let i = floaters.length - 1; i >= 0; i--) {
                let f = floaters[i];
                f.life -= 0.015;
                f.scale += (1.2 - f.scale) * 0.1; 
                
                if(f.life <= 0) { floaters.splice(i, 1); continue; }
                f.x += f.vx;
                f.y += f.vy;
                
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.scale(f.scale, f.scale);
                ctx.font = "900 18px 'Orbitron'";
                ctx.fillStyle = `rgba(255, 255, 255, ${f.life})`;
                ctx.shadowColor = `rgba(255, 255, 255, ${f.life * 0.8})`;
                ctx.shadowBlur = 15;
                ctx.fillText(f.text, 0, 0);
                ctx.restore();
            }
            
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life -= 0.02;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; 
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                ctx.shadowColor = 'rgba(255, 150, 50, 1)'; 
                ctx.shadowBlur = 10;
                ctx.fill();
            }
        }

        window.onload = () => {
            document.body.addEventListener('pointerdown', initAudio, { once: true });

            loadGame(); 
            init3D();
            updatePlanetVisuals();
            resizeCanvas();
            
            const clicker = document.getElementById('main-clicker');
            clicker.addEventListener('mousedown', () => doClick(true));
            clicker.addEventListener('touchstart', (e) => { e.preventDefault(); doClick(true); });
            
            initSkills(); 
            recalculate();
            // STAGE 6: первый оффер планируется на 10–20 минут активной видимой игры.
            scheduleNextRandomEvent();
            if (new URLSearchParams(location.search).has('dev')) {
                window.stage6Event = id => showRandomEventOffer(id);
            }
            // STAGE 4: offline имеет приоритет; daily создаётся заранее и показывается после него.
            prepareDailyReward(Date.now());
            // STAGE 5: набор заданий генерируется после recalculate и затем замораживается.
            prepareDailyTasks(Date.now());
            updateStage5UI();
            scheduleStartupModal();
            
            if ((document.body.clientWidth < 768 && state.uiMode === 'auto') || state.uiMode === 'mobile') {
                switchTab('core');
            } else {
                switchTab('build');
            }
            
            requestAnimationFrame(gameLoop);
            requestAnimationFrame(animateCanvas);
            lastFrame = performance.now();

            initYandexSDK();
        };

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                saveGame();
                if (ysdk && ysdk.gameplayStop) { try { ysdk.gameplayStop(); } catch(e) {} }
            } else {
                prepareOfflineReward(Date.now());
                prepareDailyReward(Date.now());
                // STAGE 5: resume проверяет локальный rollover.
                prepareDailyTasks(Date.now());
                updateStage5UI();
                scheduleStartupModal();
                lastFrame = performance.now();
                if (ysdk && ysdk.gameplayStart) { try { ysdk.gameplayStart(); } catch(e) {} }
            }
        });
        window.addEventListener('pagehide', () => saveGame());
        window.addEventListener('beforeunload', () => saveGame());
    </script>
</body>
</html>
